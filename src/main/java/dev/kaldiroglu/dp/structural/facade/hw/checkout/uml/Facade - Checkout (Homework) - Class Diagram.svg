ans-serif" font-size="13" lengthAdjust="spacing" textLength="278.9795" x="918.36" y="106.9883">declined. Somebody must put it back &#8212; and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.394" x="918.36" y="122.2988">if the facade does not, every caller needs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5869" x="918.36" y="137.6094">the subsystem knowledge the facade exists</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.7295" x="918.36" y="152.9199">to remove.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="918.36" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9858" x="918.36" y="183.541">So compensation lives here. A facade over</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.002" x="918.36" y="198.8516">several subsystems</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="148.0146" x="1044.4752" y="198.8516">inherits responsibility</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.8008" x="918.36" y="214.1621">for half-finished work&lt;/b&gt;.</text></g><!--link CheckoutFacade to InventoryService--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk7"><path codeLine="16" d="M368.02,165.5983 C330.34,201.6783 274.1619,255.4507 245.8419,282.5607" fill="none" id="CheckoutFacade-to-InventoryService" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="242.23,286.0183,251.4974,282.6842,245.8419,282.5607,245.9653,276.9052,242.23,286.0183" style="stroke:#181818;stro