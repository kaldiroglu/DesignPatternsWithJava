</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.0537" x="655.02" y="563.0072">at deployment &#8212; by somebody</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0249" x="655.02" y="578.3177">who is not the caller.</text></g><g class="entity" data-qualified-name="N1" data-source-line="40" id="ent0022"><path d="M658.15,43.4883 L658.15,99.4199 L916.9332,99.4199 L916.9332,53.4883 L906.9332,43.4883 L658.15,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M906.9332,43.4883 L906.9332,53.4883 L916.9332,53.4883 L906.9332,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8516" x="664.15" y="61.0566">isInfoEnabled() is on the facade for a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.7832" x="664.15" y="76.3672">reason: it lets the caller skip work the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7622" x="664.15" y="91.6777">subsystem would only throw away.</text></g><!--link Application to Logger--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="20" id="lnk9"><path codeLine="20" d="M568.54,87.7883 C568.54,105.2283 568.54,129.5683 568.54,154.9583" fill="none" id="Application-to-Logger" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="568.54,159.9583,572.54,150.9583,568.54,154.9583,564.54,150.9583,568.54,159.9583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Logger to FacadeLogger--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="extension" data-source-line="21" id="lnk10"><path codeLine="21" d="M499.9355,270.5136 C469.3855,297.2536 44