t="700" lengthAdjust="spacing" textLength="72.2744" x="482.2741" y="211.5266">subsystem</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.0845" x="325.03" y="226.8372">type&lt;/b&gt;. Callers still import</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.2207" x="325.03" y="242.1477">QueryPlan and ResultSetCursor, and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.728" x="325.03" y="257.4583">still have to know that advance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.7354" x="325.03" y="272.7688">comes before current().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="325.03" y="288.0794">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.1812" x="325.03" y="303.3899">A layer was added. No dependency</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.8867" x="325.03" y="318.7005">was removed.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="38" id="ent0015"><path d="M907.1,232.2283 L907.1,288.1599 A0,0 0 0 0 907.1,288.1599 L1165.4643,288.1599 A0,0 0 0 0 1165.4643,288.1599 L1165.4643,242.2283 L1155.4643,232.2283 L1004.31,232.2283 L856.3,122.1983 L996.31,232.2283 L907.1,232.2283 A0,0 0 0 0 907.1,232.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1155.4643,232.2283 L1155.4643,242.2283 L1165.4643,242.2283 L1155.4643,232.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.7554" x="913.1" y="249.7966">Strings in, bytes out.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="53.4409" x="913.1" y="265.1072">Nothing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8101" x="970.6542" y="265.1072">from the subsystem appears</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.5684" x="913.1" y="280.4177">in the signature.</text></g><g class="entity" data-qualified-name="N1" data-source-line="44" id="ent0017"><path d="M998.17,61.2583 L998.17,117.1899 L1284.4005,117.1899 L1284.4005,71.2583 L1274.4005,61.2583 L998.17,61.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1274.4005,61.2583 L1274.4005,71.2583 L1284.4005,71.2583 L1274.4005,61.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.4253" x="1004.17" y="78.8266">A facade is judged by what its clients</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.1792" x="1004.17" y="94.1372">have to</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="36.4038" x="1054.4625" y="94.1372">name</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.4209" x="1094.9796" y="94.1372">&#8212; not by how many classes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.1709" x="1004.17" y="109.4477">it wraps.</text></g><!--link LeakyReportFacade to QueryPlan--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="21" id="lnk7"><path codeLine="21" d="M173.71,134.1783 C142.29,168.2083 103.651,210.0539 79.951,235.7339" fill="none" id="LeakyReportFacade-to-QueryPlan" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="76.56,