59.4668" x="788.37" y="183.541">can absorb: knowledge a client could not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.4102" x="788.37" y="198.8516">have discovered from the subsystem itself.</text></g><!--link VideoConverter to Demuxer--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="17" id="lnk8"><path codeLine="17" d="M352.63,158.0883 C272.87,191.0883 156.56,239.1962 96.01,264.2562" fill="none" id="VideoConverter-to-Demuxer" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="91.39,266.1683,101.2356,266.4225,96.01,264.2562,98.1763,259.0306,91.39,266.1683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VideoConverter to AudioDecoder--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="18" id="lnk9"><path codeLine="18" d="M382.7,158.0883 C333.91,191.0883 264.0812,238.3065 227.0412,263.3665" fill="none" id="VideoConverter-to-AudioDecoder" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="222.9,266.1683,232.5957,264.438,227.0412,263.3665,228.1128,257.812,222.9,266.1683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VideoConverter to VideoDecoder--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="19" id="lnk10"><path codeLine="19" d="M416.36,157.8983 C402.12,190.9683 382.4165,236.6855 371.6365,261.7355" fill="none" id="VideoConverter-to-VideoDecoder" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="369.66,266.3283,376.8918,259.6424,371.6365,261.7355,369.5434,256.4801,369.66,266.3283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VideoConverter to Scaler--><g