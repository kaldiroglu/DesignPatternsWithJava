x="686.95" y="61.0566">The trap.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8418" x="751.1185" y="61.0566">One person reporting to two</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5552" x="686.95" y="76.3672">managers makes the structure a graph,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.9106" x="686.95" y="91.6777">not a tree &#8212; and every roll-up over it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.1587" x="686.95" y="106.9883">silently over-counts:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="686.95" y="122.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.1221" x="695.1766" y="137.6094">headcount()          7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.4771" x="695.1766" y="152.9199">distinctHeadcount()  6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="686.95" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5571" x="686.95" y="183.541">Nothing throws. Nothing warns.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5806" x="686.95" y="198.8516">Composite assumes a tree.</text></g><!--reverse link Employee to IndividualContributor--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="27" id="lnk4"><path codeLine="27" d="M540.8182,193.3167 C577.5682,220.5167 605.73,236.5983 605.73,236.5983 C605.73,236.5983 652.11,275.1683 701.11,306.0583" fill="none" id="Employee-backt