ntity" data-qualified-name="Manager" data-source-line="18" id="ent0003"><rect fill="#F1F1F1" height="122.5742" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.4648" x="7" y="63.7583"/><ellipse cx="74.915" cy="84.0688" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M77.3882,90.2119 Q76.8071,90.5107 76.168,90.6601 Q75.5288,90.8096 74.8232,90.8096 Q72.3164,90.8096 70.9966,89.1577 Q69.6768,87.5058 69.6768,84.3847 Q69.6768,81.2554 70.9966,79.6035 Q72.3164,77.9516 74.8232,77.9516 Q75.5288,77.9516 76.1763,78.1011 Q76.8237,78.2505 77.3882,78.5493 L77.3882,81.272 Q76.7573,80.6909 76.1638,80.4211 Q75.5703,80.1513 74.9395,80.1513 Q73.5947,80.1513 72.9099,81.218 Q72.2251,82.2846 72.2251,84.3847 Q72.2251,86.4765 72.9099,87.5432 Q73.5947,88.6098 74.9395,88.6098 Q75.5703,88.6098 76.1638,88.3401 Q76.7573,88.0703 77.3882,87.4892 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="75.1348" x="93.415" y="80.3598">&#171;Composite&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.4678" x="101.7485" y="96.4262">Manager</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="221.4648" y1="104.3794" y2="104.3794"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.1436" x="13" y="121.9145">-salary : long</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.6035" x="13" y="138.4028">-reports : List&lt;Employee&gt;</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="221.4648" y1="145.3559" y2="145.3559"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.4648" x="13" y="162.8911">+add(e : Employee) : Manager</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.8838" x="13" y="179.3794">+distinctHeadcount() : int</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="30" id="ent0008"><path d="M257.81,89.4183 L257.81,121.0483 L222.84,125.0483 L257.81,129.0483 L257.81,160.6605 A0,0 0 0 0 257.81,160.6605 L515.6601,160.6605 A0,0 0 0 0 515.6601,160.6605 L515.6601,99.4183 L505.6601,89.4183 L257.81,89.4183 A0,0 0 0 0 257.81,89.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M505.6601,89.4183 L505.6601,99.4183 L515.6601,99.4183 L505.6601,89.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.6958" x="263.81" y="106.9866">A manager counts</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="63.9019" x="382.6191" y="106.9866">their own</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.8545" x="450.6342" y="106.9866">salary</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.0674" x="263.81" y="122.2972">as well as their reports'. Otherwise</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.8501" x="263.81" y="137.6077">the cost of the company excludes the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.5093" x="263.81" y="152.9183">chief executive.</text></g><g class="entity" data-qualified-name="N1" data-source-line="37" id="ent0010"><path d="M550.95,43.4883 L550.95,206.5938 L820.5052,206.5938 L820.5052,53.4883 L810.5052,43.4883 L550.95,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M810.5052,43.4883 L810.5052,53.4883 L820.5052,53.4883 L810.5052,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="60.0552" x="556.95" y="61.0566">The trap.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8418" x="621.1185" y="61.0566">One person reporting to two</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5552" x="556.95" y="76.3672">managers makes the structure a graph,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.9106" x="556.95" y="91.6777">not a tree &#8212; and every roll-up over it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.1587" x="556.95" y="106.9883">silently over-counts:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="556.95" y="122.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.1221" x="565.1766" y="137.6094">headcount()          7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.4771" x="565.1766" y="152.9199">distinctHeadcount()  6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="556.95" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5571" x="556.95" y="183.541">Nothing throws. Nothing warns.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5806" x="556.95" y="198.8516">Composite assumes a tree.</text></g><!--reverse link Employee to IndividualContributor--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="25" id="lnk4"><path codeLine="25" d="M114.73,416.5983 C114.73,436.6283 114.73,440.7283 114.73,459.0783" fill="none" id="Employee-backto-Individu