L668.8185,43.4883 L405.88,43.4883 A0,0 0 0 0 405.88,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M668.8185,43.4883 L668.8185,53.4883 L678.8185,53.4883 L668.8185,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4707" x="411.88" y="61.0566">Child management is declared</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6816" x="607.464" y="61.0566">here</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="637.1456" y="61.0566">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9385" x="411.88" y="76.3672">on the Component &#8212; GoF's own choice,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.7153" x="411.88" y="91.6777">and the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="78.2983" x="463.7086" y="91.6777">transparent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.6509" x="546.1202" y="91.6777">one. Every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0957" x="411.88" y="106.9883">element looks alike to a client.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="411.88" y="122.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.1382" x="411.88" y="137.6094">The price: add() on a Line has to fail</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4575" x="411.88" y="152.9199">at run time, because it compiles.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="37" id="ent0015"><path d="M313.05,363.7683 L313.05,404.3894 A0,0 0 0 0 313.05,404.3894 L551.654,404.3894 A0,0 0 0 0 551.654,404.3894 L551.654,373.7683 L541.654,363.7683 L436.35,363.7683 L432.35,302.9683 L428.35,363.7683 L313.05,363.7683 A0,0 0 0 0 313.05,363.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M541.654,363.7683 L541.654,373.7683 L551.654,373.7683 L541.654,363.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.604" x="319.05" y="381.3366">draw() draws itself, then asks each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.4785" x="319.05" y="396.6472">child to draw. That is the pattern.</text></g><!--reverse link Graphic to Line--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="20" id="lnk6"><path codeLine="20" d="M177.5262,170.2594 C134.0762,201.3794 97.57,227.5183 66.85,249.5183" fill="none" id="Graphic-backto-Line" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="192.16,159.7783,174.0325,165.3814,181.0199,175.1373,192.16,159.7783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Graphic to Rectangle--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="21" id="lnk7"><path codeLine="21" d="M221.4458,174.5371 C199.6558,205.7471 184.31,227.7383 168.96,249.7183" fill="none" id="Graphic-backto-Rectangle" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="231.75,159.7783,216.5262,171.1024,226.3654,177.9718,231.75,159.7783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Graphic to Text--><g class="link" data-entity-1="ent0001" data-enti