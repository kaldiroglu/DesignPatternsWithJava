000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.4746" x="269.1113" y="282.5662">Text</text></g><!--class Picture--><g class="entity" data-qualified-name="Picture" data-source-line="17" id="ent0005"><rect fill="#F1F1F1" height="65.1094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.8086" x="338.94" y="237.6583"/><ellipse cx="392.5269" cy="257.9688" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M395.0001,264.1119 Q394.419,264.4107 393.7798,264.5601 Q393.1407,264.7096 392.4351,264.7096 Q389.9283,264.7096 388.6085,263.0577 Q387.2886,261.4058 387.2886,258.2847 Q387.2886,255.1554 388.6085,253.5035 Q389.9283,251.8516 392.4351,251.8516 Q393.1407,251.8516 393.7881,252.0011 Q394.4356,252.1505 395.0001,252.4493 L395.0001,255.172 Q394.3692,254.5909 393.7757,254.3211 Q393.1822,254.0513 392.5513,254.0513 Q391.2066,254.0513 390.5218,255.118 Q389.837,256.1846 389.837,258.2847 Q389.837,260.3765 390.5218,261.4432 Q391.2066,262.5098 392.5513,262.5098 Q393.1822,262.5098 393.7757,262.2401 Q394.3692,261.9703 395.0001,261.3892 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="75.1348" x="411.0269" y="254.2598">&#171;Composite&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.4092" x="425.3897" y="270.3262">Picture</text><line style="stroke:#181818;stroke-width:0.5;" x1="339.94" x2="524.7486" y1="278.2794" y2="278.2794"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.8086" x="344.94" y="295.8145">-children : List&lt;Graphic&gt;</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="27" id="ent0011"><path d="M347.88,43.4883 L347.88,98.0683 L313.01,102.0683 L347.88,106.0683 L347.88,160.6621 A0,0 0 0 0 347.88,160.6621 L620.8185,160.6621 A0,0 0 0 0 620.8185,160.6621 L620.8185,53.4883 L610.8185,43.4883 L347.88,43.4883 A0,0 0 0 0 347.88,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M610.8185,43.4883 L610.8185,53.4883 L620.8185,53.4883 L610.8185,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4707" x="353.88" y="61.0566">Child management is declared</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6816" x="549.464" y="61.0566">here</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="579.1456" y="61.0566">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9385" x="353.88" y="76.3672">on the Component &#8212; GoF's own choice,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.7153" x="353.88" y="91.6777">and the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="78.2983" x="405.7086" y="91.6777">transparent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.6509" x="488.1202" y="91.6777">one. Every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0957" x="353.88" y="106.9883">element looks alike to a client.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="353.88" y="122.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.1382" x="353.88" y="137.6094">The price: add() on a Line has to fail</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4575" x="353.88" y="152.9199">at run time, because it compiles.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="37" id="ent0014"><path d="M313.05,363.7683 L313.05,404.3894 A0,0 0 0 0 313.05,404.3894 L551.654,404.3894 A0,0 0 0 0 551.654,404.3894 L551.654,373.7683 L541.654,363.7683 L436.35,363.7683 L432.35,302.9683 L428.35,363.7683 L313.05,363.7683 A0,0 0 0 0 313.05,363.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M541.654,363.7683 L541.654,373.7683 L551.654,373.7683 L541.654,363.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.604" x="319.05" y="381.3366">draw() draws itself, then asks each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.4785" x="319.05" y="396.6472">child to draw. That is the pattern.</text></g><!--reverse link Graphic to Line--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="21" id="lnk6"><path codeLine="21" d="M140.9327,172.2101 C108.2527,203.4201 82.78,227.7383 59.76,249.7183" fill="none" id="Graphic-backto-Line" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="153.95,159.7783,136.7887,167.871,145.0766,176.5492,153.95,159.7783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Graphic to Rectangle--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="22" id="lnk7"><path codeLine="22" d="M187.6199,176.7734 C176.7299,207.9834 169.83,227.7383 162.15,249.7183" fill="none" id="Graphic-backto-Rectangle" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="193.55,159.7783,181.9549,174.7967,193.285,178.7501,193.55,159.7783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Graphic to Text--><g class="link" data-entity-1="ent0001" data-entity