 fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.6475" x="308.7" y="335.4345">-children : List&lt;FormElement&gt;</text><line style="stroke:#181818;stroke-width:0.5;" x1="303.7" x2="525.3475" y1="342.3877" y2="342.3877"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.2314" x="308.7" y="359.9228">+with(elements...) : Section</text></g><g class="entity" data-qualified-name="GMN6" data-source-line="32" id="ent0007"><path d="M443.35,67.3283 L443.35,114.2583 L373.79,118.2583 L443.35,122.2583 L443.35,169.1916 A0,0 0 0 0 443.35,169.1916 L675.6825,169.1916 A0,0 0 0 0 675.6825,169.1916 L675.6825,77.3283 L665.6825,67.3283 L443.35,67.3283 A0,0 0 0 0 443.35,67.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M665.6825,67.3283 L665.6825,77.3283 L675.6825,77.3283 L665.6825,67.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.3745" x="449.35" y="84.8966">add() is declared</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6816" x="557.8378" y="84.8966">here</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.2861" x="591.6327" y="84.8966">&#8212; the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="78.2983" x="449.35" y="100.2072">transparent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.7549" x="531.7616" y="100.2072">side of GoF's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1216" x="449.35" y="115.5177">implementation issue 4.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="449.35" y="130.8283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3325" x="449.35" y="146.1388">Every element looks alike, and no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9263" x="449.35" y="161.4494">client ever tests a type.</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="41" id="ent0010"><path d="M6,436.1283 L6,553.3021 A0,0 0 0 0 6,553.3021 L243.0425,553.3021 A0,0 0 0 0 243.0425,553.3021 L243.0425,446.1283 L233.0425,436.1283 L128.52,436.1283 L124.52,375.1983 L120.52,436.1283 L6,436.1283 A0,0 0 0 0 6,436.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M233.0425,436.1283 L233.0425,446.1283 L243.0425,446.1283 L233.0425,436.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.4141" x="12" y="453.6966">The bill: add() on a Question must</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6289" x="12" y="469.0072">throw, and the call that does it</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="186.1387" x="12" y="484.3177">compiles without complaint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="198.1387" y="484.3177">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="12" y="499.6283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3647" x="12" y="514.9388">composite.graphic and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0425" x="12" y="530.2494">composite.fileSystem chose safety</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4331" x="12" y="545.5599">instead. Compare the three.</text></g><g class="entity" data-qualified-name="N1" data-source-line="51" id="ent0012"><path d="M745.44,82.6383 L745.44,153.8805 L1015.5982,153.8805 L1015.5982,92.6383 L1005.5982,82.6383 L745.44,82.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1005.5982,82.6383 L1005.5982,92.6383 L1015.5982,92.6383 L1005.5982,82.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.3447" x="751.44" y="100.2066">validate()</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.623" x="812.898" y="100.2066">concatenates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.2813" x="904.6343" y="100.2066">rather than</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.1582" x="751.44" y="115.5172">sums &#8212; the shape most real composite</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.126" x="751.44" y="130.8277">operations take, and slightly harder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.999" x="751.44" y="146.1383">than adding numbers up.</text></g><!--reverse link FormElement to Question--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="28" id="lnk4"><path codeLine="28" d="M179.9096,206.6015 C160.1996,231.8715 152.11,245.4683 138.54,268.7283" fill="none" id="FormElement-backto-Question" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="190.98,192.4083,175.1786,202.9114,184.6407,210.2916,190.98,192.4083" style="stroke:#181818;