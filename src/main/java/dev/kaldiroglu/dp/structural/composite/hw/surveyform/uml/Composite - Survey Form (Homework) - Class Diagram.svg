 fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.6475" x="273.7" y="335.4345">-children : List&lt;FormElement&gt;</text><line style="stroke:#181818;stroke-width:0.5;" x1="268.7" x2="490.3475" y1="342.3877" y2="342.3877"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.2314" x="273.7" y="359.9228">+with(elements...) : Section</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="31" id="ent0008"><path d="M461.35,67.3283 L461.35,114.2583 L426.52,118.2583 L461.35,122.2583 L461.35,169.1916 A0,0 0 0 0 461.35,169.1916 L693.6825,169.1916 A0,0 0 0 0 693.6825,169.1916 L693.6825,77.3283 L683.6825,67.3283 L461.35,67.3283 A0,0 0 0 0 461.35,67.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M683.6825,67.3283 L683.6825,77.3283 L693.6825,77.3283 L683.6825,67.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.3745" x="467.35" y="84.8966">add() is declared</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6816" x="575.8378" y="84.8966">here</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.2861" x="609.6327" y="84.8966">&#8212; the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="78.2983" x="467.35" y="100.2072">transparent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.7549" x="549.7616" y="100.2072">side of GoF's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1216" x="467.35" y="115.5177">implementation issue 1.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="467.35" y="130.8283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3325" x="467.35" y="146.1388">Every element looks alike, and no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9263" x="467.35" y="161.4494">client ever tests a type.</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="40" id="ent0011"><path d="M6,436.1283 L6,553.3021 A0,0 0 0 0 6,553.3021 L243.0425,553.3021 A0,0 0 0 0 243.0425,553.3021 L243.0425,446.1283 L233.0425,436.1283 L128.52,436.1283 L124.52,375.1983 L120.52,436.1283 L6,436.1283 A0,0 0 0 0 6,436.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M233.0425,436.1283 L233.0425,446.1283 L243.0425,446.1283 L233.0425,436.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.4141" x="12" y="453.6966">The bill: add() on a Question must</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6289" x="12" y="469.0072">throw, and the call that does it</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="186.1387" x="12" y="484.3177">compiles without complaint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="198.1387" y="484.3177">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="12" y="499.6283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3647" x="12" y="514.9388">composite.graphic and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0425" x="12" y="530.2494">composite.fileSystem chose safety</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4331" x="12" y="545.5599">instead. Compare the three.</text></g><g class="entity" data-qualified-name="N1" data-source-line="50" id="ent0013"><path d="M728.44,82.6383 L728.44,153.8805 L998.5982,153.8805 L998.5982,92.6383 L988.5982,82.6383 L728.44,82.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M988.5982,82.6383 L988.5982,92.6383 L998.5982,92.6383 L988.5982,82.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.3447" x="734.44" y="100.2066">validate()</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.623" x="795.898" y="100.2066">concatenates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.2813" x="887.6343" y="100.2066">rather than</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.1582" x="734.44" y="115.5172">sums &#8212; the shape most real composite</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.126" x="734.44" y="130.8277">operations take, and slightly harder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.999" x="734.44" y="146.1383">than adding numbers up.</text></g><!--reverse link FormElement to Question--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="26" id="lnk4"><path codeLine="26" d="M237.5485,205.2907 C212.8885,230.5607 198.33,245.4683 175.62,268.7283" fill="none" id="FormElement-backto-Question" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="250.12,192.4083,233.2544,201.1002,241.8427,209.4812,250.12,192.4083" style="stroke:#181818;stroke