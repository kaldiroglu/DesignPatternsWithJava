"138.9121" x="484.9877" y="550.0766">&#8212; the position arrives</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.4614" x="415.1" y="565.3872">as an argument. Store it and the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.4712" x="415.1" y="580.6977">sharing ends.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="415.1" y="596.0083">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="8.5757" x="415.1" y="611.3188">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.9976" x="427.789" y="611.3188">texture loads, not 10,000.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="56" id="ent0019"><path d="M896.49,348.5983 L896.49,419.8405 A0,0 0 0 0 896.49,419.8405 L1157.5012,419.8405 A0,0 0 0 0 1157.5012,419.8405 L1157.5012,358.5983 L1147.5012,348.5983 L976.98,348.5983 L786.58,227.9883 L968.98,348.5983 L896.49,348.5983 A0,0 0 0 0 896.49,348.5983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1147.5012,348.5983 L1147.5012,358.5983 L1157.5012,358.5983 L1147.5012,348.5983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.2705" x="902.49" y="366.1666">getType takes</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="69.0244" x="994.8738" y="366.1666">no texture</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.7959" x="1063.8982" y="366.1666">. The old</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.0112" x="902.49" y="381.4772">signature accepte