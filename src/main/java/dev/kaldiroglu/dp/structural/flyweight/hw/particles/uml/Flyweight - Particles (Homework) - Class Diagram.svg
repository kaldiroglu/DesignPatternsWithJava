ill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.2549" x="13" y="94.0434">-x, y, dx, dy : double[]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.7275" x="13" y="110.5317">-age : int[]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.1084" x="13" y="127.02">-types : List&lt;ParticleType&gt;</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="204.1084" y1="133.9731" y2="133.9731"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.4131" x="13" y="151.5083">+spawn(type, x, y, dx, dy)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8711" x="13" y="167.9966">+tick()</text></g><g class="entity" data-qualified-name="GMN6" data-source-line="31" id="ent0007"><path d="M239.71,43.4883 L239.71,105.7283 L205.35,109.7283 L239.71,113.7283 L239.71,175.9727 A0,0 0 0 0 239.71,175.9727 L510.3887,175.9727 A0,0 0 0 0 510.3887,175.9727 L510.3887,53.4883 L500.3887,43.4883 L239.71,43.4883 A0,0 0 0 0 239.71,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M500.3887,43.4883 L500.3887,53.4883 L510.3887,53.4883 L500.3887,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.5024" x="245.71" y="61.0566">The state that</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="45.208" x="337.3257" y="61.0566">cannot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.2695" x="386.647" y="61.0566">be shared &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.7212" x="245.71" y="76.3672">position, velocity, age &#8212; changes 60</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.9092" x="245.71" y="91.6777">times a second.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="245.71" y="106.9883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.1558" x="245.71" y="122.2988">So it is kept in</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.4272" x="339.979" y="122.2988">parallel arrays</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="436.4063" y="122.2988">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.9067" x="245.71" y="137.6094">not in a million objects. Flyweight</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.6787" x="245.71" y="152.9199">removed the shared state; this removes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.4507" x="245.71" y="168.2305">the rest.</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="42" id="ent0010"><path d="M415.62,453.0383 L415.62,478.3488 A0,0 0 0 0 415.62,478.3488 L648.4857,478.3488 A0,0 0 0 0 648.4857,478.3488 L648.4857,463.0383 L638.4857,453.0383 L536.05,453.0383 L532.05,392.4483 L528.05,453.0383 L415.62,453.0383 A0,0 0 0 0 415.62,453.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M638.4857,453.0383 L638.4857,463.0383 L648.4857,463.0383 L638.4857,453.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.4375" x="421.62" y="470.6066">1,000,000 particles -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="8.5757" x="571.1708" y="470.6066">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.626" x="583.8597" y="470.6066">objects.</text></g><!--link ParticleSystem to ParticleType--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="aggregation" data-source-line="27" id="lnk4"><path codeLine="27" d="M216.0414,172.9181 C221.6314,175.9081 216.61,173.1683 222.05,175.9783 C300.28,216.2683 387.1139,256.5487 450.2939,285.1087" fill="none" id="ParticleSystem-ParticleType" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="205.46,167.2583,208.8641,173.6153,216.0414,172.9181,212.6373,166.5611,205.46,167.2583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#181818" points="454.85,287.1683,448.2966,279.8162,450.2939,285.1087,445.0013,287.106,454.85,287.1683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.6182" x="315.8" y="219.5466">shared</text></g><!--link ParticleFactory to ParticleType--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="28" id="lnk5"><path codeLine="28" d="M662.46,154.9183 C640.35,183.1683 614.2914,216.4507 589.1714,248.5507" fill="none" id="ParticleFactory-to-ParticleType" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="586.09,252.4883,594.7866,247.8657,589.1714,248.5507,588.4864,242.9354,586.09,252.4883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src PPFTgXCn4CVlynJ3kMenhHN5YxeiY710K13QE_4YcvrsO_En9DDJLn5y29_G9t6IxVUvA4jd_fd_RoQJj3E-Lr4vq5Qbz9ueccPF-547lp8_4HQYCoq2kfu6SEWQZ4cG8OlmQ8S3ccr7yE_FN-Y2mqE8EtYz10NEM6k21wvDHbjC4ZPX7u7jsYI4A6xmvPXT3pr2LNq