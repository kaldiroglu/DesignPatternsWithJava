216.9248" x="41.56" y="602.0083">Two occurrences of 'o' would fight</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.6318" x="41.56" y="617.3188">over one field.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="50" id="ent0016"><path d="M984.5,342.4183 L984.5,413.6605 A0,0 0 0 0 984.5,413.6605 L1211.4941,413.6605 A0,0 0 0 0 1211.4941,413.6605 L1211.4941,352.4183 L1201.4941,342.4183 L1051.43,342.4183 L864.49,215.3483 L1043.43,342.4183 L984.5,342.4183 A0,0 0 0 0 984.5,342.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1201.4941,342.4183 L1201.4941,352.4183 L1211.4941,352.4183 L1201.4941,342.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0132" x="990.5" y="359.9866">Position is the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="108.7544" x="1083.6265" y="359.9866">index in this list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1192.3809" y="359.9866">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.6694" x="990.5" y="375.2972">It needed no home at all.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="990.5" y="390.6077">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.8574" x="990.5" y="405.9183">236 characters -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.1514" x="1110.4707" y="405.9183">29</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.626" x="1131.7354" y="405.9183">objects.</text></g><!-