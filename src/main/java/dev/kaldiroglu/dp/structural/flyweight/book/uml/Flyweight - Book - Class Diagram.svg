8632 L664.6616,577.8632 A0,0 0 0 0 664.6616,577.8632 L664.6616,440.0683 L654.6616,430.0683 L459.77,430.0683 A0,0 0 0 0 459.77,430.0683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M654.6616,430.0683 L654.6616,440.0683 L664.6616,440.0683 L654.6616,430.0683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="171.1201" x="465.77" y="447.6366">Two fields, both intrinsic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4771" x="465.77" y="462.9472">Immutable, package-private</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.5273" x="465.77" y="478.2577">constructor.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="465.77" y="493.5683">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.1831" x="465.77" y="508.8788">It used to carry</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="24.6099" x="565.0664" y="508.8788">line</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.4292" x="593.7895" y="508.8788">and</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.8311" x="465.77" y="524.1894">position</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.2231" x="524.7143" y="524.1894">as well &#8212; labelled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.2437" x="465.77" y="539.4999">extrinsic in a comment and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.8916" x="465.77" y="554.8105">stored anyway, which is what</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.6343" x="465.77" y="570.121">made it unshareable.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="48" id="ent0016"><path d="M699.71,468.3383 L699.71,539.5805 A0,0 0 0 0 699.71,539.5805 L926.7041,539.5805 A0,0 0 0 0 926.7041,539.5805 L926.7041,478.3383 L916.7041,468.3383 L792.54,468.3383 L704.87,349.0983 L784.54,468.3383 L699.71,468.3383 A0,0 0 0 0 699.71,468.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M916.7041,468.3383 L916.7041,478.3383 L926.7041,478.3383 L916.7041,468.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0132" x="705.71" y="485.9066">Position is the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="108.7544" x="798.8365" y="485.9066">index in this list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="907.5909" y="485.9066">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.6694" x="705.71" y="501.2172">It needed no home at all.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="705.71" y="516.5277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.8574" x="705.71" y="531.8383">236 characters -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.1514" x="825.6807" y="531.8383">29</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.626" x="846.9454" y="531.8383">objects.</text></g>