font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.3057" x="79.83" y="292.46">+markInUse()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.7813" x="79.83" y="308.9483">+markFree()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5723" x="79.83" y="325.4366">+query(sql)</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="23" id="ent0005"><path d="M330.79,65.2583 L330.79,89.2183 L295.73,93.2183 L330.79,97.2183 L330.79,121.1899 A0,0 0 0 0 330.79,121.1899 L549.6718,121.1899 A0,0 0 0 0 549.6718,121.1899 L549.6718,75.2583 L539.6718,65.2583 L330.79,65.2583 A0,0 0 0 0 330.79,65.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M539.6718,65.2583 L539.6718,75.2583 L549.6718,75.2583 L539.6718,65.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="115.3687" x="336.79" y="82.8266">borrow / release.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.4653" x="456.2719" y="82.8266">A flyweight</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.8818" x="336.79" y="98.1372">factory has no release, because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.0151" x="336.79" y="113.4477">there is nothing to give back.</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="29" id="ent0008"><path d="M25.94,392.3983 L25.94,540.1932 A0,0 0 0 0 25.94,540.1932 L276.5157,540.1932 A0,0 0 0 0 276.5157,540.1932 L276.5157,402.3983 L266.5157,392.3983 L155.23,392.3983 L151.23,332.7183 L147.23,392.3983 L25.94,392.3983 A0,0 0 0 0 25.94,392.3983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M266.5157,392.3983 L266.5157,402.3983 L276.5157,402.3983 L266.5157,392.3983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="155.3843" x="31.94" y="409.9666">Mutable, and exclusive.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.0781" x="191.4376" y="409.9666">One holder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.0674" x="31.94" y="425.2772">at a time; two would be the bug.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="31.94" y="440.5877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.9946" x="31.94" y="455.8983">A flyweight is held by everybody</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.3745" x="31.94" y="471.2088">at once, which is safe only because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.668" x="31.94" y="486.5194">it is immutable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="31.94" y="501.8299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.4316" x="31.94" y="517.1405">Pool saves</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.7197" x="101.4849" y="517.1405">time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="131.2046" y="517.1405">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0903" x="31.94" y="532.451">Flyweight saves</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.6216" x="134.1436" y="532.451">memory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="188.7652" y="532.451">.</text></g><!--reverse link ConnectionPool to PooledConnection--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="aggregation" data-source-line="20" id="lnk3"><path codeLine="20" d="M151.23,154.1183 C151.23,172.4983 151.23,181.7983 151.23,201.4983" fill="none" id="ConnectionPool-backto-PooledConnection" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="151.23,142.1183,147.23,148.1183,151.23,154.1183,155.23,148.1183,151.23,142.1183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src RPB1RXCn48RlVeev9g99EKDLgKMgr4Cf27W0spk9JRoUr1vdMH0I3y4JyYICrzcq2Xp7_ltFD_yuxtpSwwHxi47dVCESl2cCzvRY9_yTuRLolaF0ViyZzDWRJ5cnvu3m_l4pt8LnGBzr37z-_GOTWSnNj0nxed0XTGU36y4p-0oHM2arzO5t5AFeFCKFeeGV2c05-g1zq4Qity1j82jisuy52yhjAp2K4WqBzZrIuOUy55LzZDspsIHC651dNCW8SQb-pYtFjSUclXCV7xaLyKkktKtLwcRNwxIxh-UBvQc-IpYNJmNJkCXFOMfrDXUjLlyoAWa28KsfqUOi2l6yCjTjLhYSPrbVNPfhk87D7BV8DjeofH6Shj7EoWimQ7N9DJDscF2Ol9CiWGcs_e1WjDsj5SfsAieHo10pzPNeFwaAqqFXkfksLVncGydYrSWU8uAZq64IhMRGKDVq5dWW6AY4JgWg3fYoNIlHl1Yb0ZgiaX7m864QwiPcGz5Aly5vwwegwmtAMHXVpDY-bk_xHZUPJz5dVS1SkIj9XLpBpVDtFLtBdvOKc-2Ko5y0?></g></svg>