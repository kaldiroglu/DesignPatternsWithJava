ngthAdjust="spacing" textLength="94.6846" x="13" y="575.8117">+height() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.6104" x="13" y="592.3">+draw(canvas, x, y) : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.9512" x="13" y="608.7883">-drawScrollbar(...) : void</text></g><!--class ScrolledBorderedTextView--><g class="entity" data-qualified-name="ScrolledBorderedTextView" data-source-line="32" id="ent0005"><rect fill="#F1F1F1" height="113.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="209.3379" x="501" y="501.7883"/><ellipse cx="516" cy="517.7883" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M518.4731,523.9313 Q517.8921,524.2302 517.2529,524.3796 Q516.6138,524.529 515.9082,524.529 Q513.4014,524.529 512.0815,522.8771 Q510.7617,521.2253 510.7617,518.1042 Q510.7617,514.9748 512.0815,513.3229 Q513.4014,511.6711 515.9082,511.6711 Q516.6138,511.6711 517.2612,511.8205 Q517.9087,511.9699 518.4731,512.2688 L518.4731,514.9914 Q517.8423,514.4104 517.2488,514.1406 Q516.6553,513.8708 516.0244,513.8708 Q514.6797,513.8708 513.9949,514.9375 Q513.3101,516.0041 513.3101,518.1042 Q513.3101,520.196 513.9949,521.2626 Q514.6797,522.3293 516.0244,522.3293 Q516.6553,522.3293 517.2488,522.0595 Q517.8423,521.7897 518.4731,521.2087 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.3379" x="530" y="523.0793">ScrolledBorderedTextView</text><line style="stroke:#181818;stroke-width:0.5;" x1="502" x2="709.3379" y1="533.7883" y2="533.7883"/><line style="stroke:#181818;stroke-width:0.5;" x1="502" x2="709.3379" y1="541.7883" y2="541.7883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.0654" x="507" y="559.3234">+width() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.6846" x="507" y="575.8117">+height() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.6104" x="507" y="592.3">+draw(canvas, x, y) : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.9512" x="507" y="608.7883">-drawScrollbar(...) : void</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="45" id="ent0011"><path d="M251.71,530.7983 L251.71,554.7583 L216.5,558.7583 L251.71,562.7583 L251.71,586.7299 A0,0 0 0 0 251.71,586.7299 L465.6343,586.7299 A0,0 0 0 0 465.6343,586.7299 L465.6343,540.7983 L455.6343,530.7983 L251.71,530.7983 A0,0 0 0 0 251.71,530.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M455.6343,530.7983 L455.6343,540.7983 L465.6343,540.7983 L455.6343,530.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9243" x="257.71" y="548.3666">Inherits the border, and has to</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="31.4146" x="257.71" y="563.6772">copy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.3154" x="293.2378" y="563.6772">the scrollbar: no class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.3472" x="257.71" y="578.9877">can inherit from both parents.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="51" id="ent0014"><path d="M745.24,530.7983 L745.24,554.7583 L710.6,558.7583 L745.24,562.7583 L745.24,586.7299 A0,0 0 0 0 745.24,586.7299 L998.0945,586.7299 A0,0 0 0 0 998.0945,586.7299 L998.0945,540.7983 L988.0945,530.7983 L745.24,530.7983 A0,0 0 0 0 745.24,530.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M988.0945,530.7983 L988.0945,540.7983 L998.0945,540.7983 L988.0945,530.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.8545" x="751.24" y="548.3666">The same two embellishments in the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.4077" x="751.24" y="563.6772">other order draw a different picture,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2554" x="751.24" y="578.9877">so they need a different class.</text></g><g class="entity" data-qualified-name="N1" data-source-line="57" id="ent0016"><path d="M500.69,43.4883 L500.69,267.8359 L828.65,267.8359 L828.65,53.4883 L818.65,43.4883 L500.69,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M818.65,43.4883 L818.65,53.4883 L828.65,53.4883 L818.65,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="234.0381" x="506.69" y="61.0566">drawScrollbar appears three times.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.1641" x="506.69" y="76.3672">Fix a bug in one copy and the other two keep it;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.8916" x="506.69" y="91.6777">the compiler will not tell you which you missed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.69" y="106.9883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="246.6255" x="506.69" y="122.2988">Five classes for two embellishments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.96" x="506.69" y="137.6094">With n embellishments whose order matters, full</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.8418" x="506.69" y="152.9199">coverage is 1 + sum(n!/(n-k)!) classes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.9956" x="523.1431" y="168.2305">n = 2  -&gt;    5      n = 4  -&gt;   65</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.2095" x="523.1431" y="183.541">n = 3  -&gt;   16      n = 5  -&gt;  326</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.69" y="198.8516">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="267.0776" x="506.69" y="214.1621">And the choice is made at compile time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0298" x="506.69" y="229.4727">Nothing can add a border to a TextView that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.9453" x="506.69" y="244.7832">already exists &#8212; only `new` can, and by then it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.8481" x="506.69" y="260.0938">is a different object of a different type.</text></g><!--reverse link TextView to BorderedTextView--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="39" id="lnk6"><path codeLine="39" d="M310.8956,228.8703 C290.1556,266.5803 275.04,299.8783 260.21,335.7283" fill="none" id="TextView-backto-BorderedTextView" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="319.57,213.0983,305.6383,225.9788,316.1529,231.7617,319.57,213.0983" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link TextView to BorderedTextView--><!--reverse link TextView to ScrolledTextView--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="40" id="lnk7"><path codeLine="40" d="M381.8011,229.6512 C396.7311,264.6012 411.52,292.7583 430.73,327.6583" fill="none" id="TextView-backto-ScrolledTextView" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="374.73,213.0983,376.2835,232.0082,387.3188,227.2942,374.73,213.0983" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link TextView to ScrolledTextView--><!--reverse link BorderedTextView to BorderedScrolledTextView--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="extension" data-source-line="41" id="lnk8"><path codeLine="41" d="M198.622,447.8248 C182.032,468.7948 173.62,479.4283 156.33,501.2883" fill="none" id="BorderedTextView-backto-BorderedScrolledTextView" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="209.79,433.7083,193.9165,444.1021,203.3275,451.5475,209.79,433.7083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link ScrolledTextView to ScrolledBorderedTextView--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="extension" data-source-line="42" id="lnk9"><path codeLine="42" d="M525.3637,456.2282 C540.3937,475.2382 546,482.3183 561.04,501.3283" fill="none" id="ScrolledTextView-backto-ScrolledBorderedTextView" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="514.2,442.1083,520.6571,459.9494,530.0703,452.5069,514.2,442.1083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src nLNBRjim4BphApRenNPjjqcQ7D87a009a4iAD45xA0g44jSc6ueKIDgo-W3w4Vt2VabtAR-Tj9SKzSdQ7StE3dV5SATj9RmemMYBiQaGAcSQViZ2CbSO4S9fZ5xdauYNXRFN-Wl2yopgQ13EpY_UlZk7Npz-0fOv6gE3qdOC0cvm5jzhh2