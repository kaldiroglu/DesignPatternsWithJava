d</text></g><!--class ScrollDecorator--><g class="entity" data-qualified-name="ScrollDecorator" data-source-line="35" id="ent0005"><rect fill="#F1F1F1" height="97.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="242.9863" x="622.81" y="481.7683"/><ellipse cx="687.9462" cy="497.7683" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M690.4194,503.9113 Q689.8383,504.2102 689.1992,504.3596 Q688.56,504.509 687.8544,504.509 Q685.3476,504.509 684.0278,502.8571 Q682.7079,501.2053 682.7079,498.0842 Q682.7079,494.9548 684.0278,493.3029 Q685.3476,491.6511 687.8544,491.6511 Q688.56,491.6511 689.2075,491.8005 Q689.8549,491.9499 690.4194,492.2488 L690.4194,494.9714 Q689.7885,494.3904 689.195,494.1206 Q688.6015,493.8508 687.9706,493.8508 Q686.6259,493.8508 685.9411,494.9175 Q685.2563,495.9841 685.2563,498.0842 Q685.2563,500.176 685.9411,501.2426 Q686.6259,502.3093 687.9706,502.3093 Q688.6015,502.3093 689.195,502.0395 Q689.7885,501.7697 690.4194,501.1887 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2139" x="708.4462" y="503.0593">ScrollDecorator</text><line style="stroke:#181818;stroke-width:0.5;" x1="623.81" x2="864.7963" y1="513.7683" y2="513.7683"/><line style="stroke:#181818;stroke-width:0.5;" x1="623.81" x2="864.7963" y1="521.7683" y2="521.7683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.0654" x="628.81" y="539.3034">+width() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.6104" x="628.81" y="555.7917">+draw(canvas, x, y) : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.9863" x="628.81" y="572.28">-drawScrollbar(canvas, x, y) : void</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="47" id="ent0011"><path d="M228.31,312.0983 L228.31,336.0583 L193.9,340.0583 L228.31,344.0583 L228.31,368.0299 A0,0 0 0 0 228.31,368.0299 L454.3012,368.0299 A0,0 0 0 0 454.3012,368.0299 L454.3012,322.0983 L444.3012,312.0983 L228.31,312.0983 A0,0 0 0 0 228.31,312.0983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M444.3012,312.0983 L444.3012,322.0983 L454.3012,322.0983 L444.3012,312.0983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9912" x="234.31" y="329.6666">Knows nothing about borders or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.7319" x="234.31" y="344.9772">scrollbars, and never has to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1162" x="234.31" y="360.2877">change when one is invented.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="53" id="ent0014"><path d="M624.91,647.4783 L624.91,688.0994 A0,0 0 0 0 624.91,688.0994 L863.6917,688.0994 A0,0 0 0 0 863.6917,688.0994 L863.6917,657.4783 L853.6917,647.4783 L748.31,647.4783 L744.31,579.5783 L740.31,647.4783 L624.91,647.4783 A0,0 0 0 0 624.91,647.4783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M853.6917,647.4783 L853.6917,657.4783 L863.6917,657.4783 L853.6917,647.4783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="26.8569" x="630.91" y="665.0466">One</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.2524" x="661.8802" y="665.0466">scrollbar implementation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.7817" x="630.91" y="680.3572">The problem design needed three.</text></g><g class="entity" data-qualified-name="N1" data-source-line="58" id="ent0016"><path d="M482.8,43.4883 L482.8,206.5938 L871.8054,206.5938 L871.8054,53.4883 L861.8054,43.4883 L482.8,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M861.8054,43.4883 L861.8054,53.4883 L871.8054,53.4883 L861.8054,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="217.5723" x="488.8" y="61.0566">Four classes, every combination.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.0537" x="488.8" y="76.3672">Border(Scroll(text)), Scroll(Border(text)),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.2998" x="488.8" y="91.6777">Border(Border(text)) &#8212; none of these needed to be</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.2329" x="488.8" y="106.9883">anticipated, and none of them is a class.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="488.8" y="122.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="306.9663" x="488.8" y="137.6094">A third embellishment costs exactly one class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="795.7663" y="137.6094">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.1685" x="488.8" y="152.9199">and every order of the three comes free with it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="488.8" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="207.0288" x="488.8" y="183.541">The choice is made at run time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.6504" x="695.8288" y="183.541">, by whoever holds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.0054" x="488.8" y="198.8516">the object, at the moment they know what the user wants.</text></g><!--reverse link VisualComponent to TextView--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="41" id="lnk6"><path codeLine="41" d="M283.1986,185.6754 C250.7086,212.9254 223.21,235.9783 186.86,266.4683" fill="none" id="VisualComponent-backto-TextView" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="296.99,174.1083,279.3429,181.0783,287.0543,190.2725,296.99,174.1083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link VisualComponent to Decorator--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="42" id="lnk7"><path codeLine="42" d="M414.1105,186.0813 C447.4505,215.7813 479.74,242.2783 519.97,274.5983" fill="none" id="VisualComponent-backto-Decorator" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="400.67,174.1083,410.1194,190.5615,418.1015,181.6012,400.67,174.1083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Decorator to VisualComponent--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="aggregation" data-source-line="70" id="lnk17"><path codeLine="70" d="M535.2577,266.7208 C498.1177,234.4008 464.7096,206.8999 426.9596,177.1999" fill="none" id="Decorator-VisualComponent" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="544.31,274.5983,542.4097,267.6421,535.2577,266.7208,537.158,273.677,544.31,274.5983" style="stroke:#181818;stroke-width:1;s