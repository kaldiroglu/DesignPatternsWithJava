4.9883" x="285.52" y="135.6211">+close()</text></g><!--class StoredDocument--><g class="entity" data-qualified-name="StoredDocument" data-source-line="12" id="ent0002"><rect fill="#F1F1F1" height="65.1094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="174.9551" x="249.83" y="401.6383"/><ellipse cx="278.1046" cy="421.9488" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M280.5777,428.0919 Q279.9967,428.3907 279.3575,428.5401 Q278.7183,428.6896 278.0128,428.6896 Q275.5059,428.6896 274.1861,427.0377 Q272.8663,425.3858 272.8663,422.2647 Q272.8663,419.1354 274.1861,417.4835 Q275.5059,415.8316 278.0128,415.8316 Q278.7183,415.8316 279.3658,415.9811 Q280.0133,416.1305 280.5777,416.4293 L280.5777,419.152 Q279.9468,418.5709 279.3533,418.3011 Q278.7598,418.0313 278.129,418.0313 Q276.7842,418.0313 276.0994,419.098 Q275.4146,420.1646 275.4146,422.2647 Q275.4146,424.3565 276.0994,425.4232 Q276.7842,426.4898 278.129,426.4898 Q278.7598,426.4898 279.3533,426.2201 Q279.9468,425.9503 280.5777,425.3692 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="79.377" x="312.094" y="418.2398">&#171;RealSubject&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.4561" x="295.0545" y="434.3063">StoredDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="250.83" x2="423.7851" y1="442.2594" y2="442.2594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.9551" x="255.83" y="459.7945">+opensPerformed() : int</text></g><!--class DocumentHandle--><g class="entity" data-qualified-name="DocumentHandle" data-source-line="16" id="ent0003"><rect fill="#F1F1F1" height="139.0625" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="212.6074" x="7" y="202.5783"/><ellipse cx="50.5754" cy="222.8888" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M53.0486,229.0319 Q52.4675,229.3307 51.8284,229.4801 Q51.1892,229.6296 50.4836,229.6296 Q47.9768,229.6296 46.657,227.9777 Q45.3372,226.3258 45.3372,223.2047 Q45.3372,220.0754 46.657,218.4235 Q47.9768,216.7716 50.4836,216.7716 Q51.1892,216.7716 51.8367,216.9211 Q52.4841,217.0705 53.0486,217.3693 L53.0486,220.092 Q52.4177,219.5109 51.8242,219.2411 Q51.2307,218.9713 50.5999,218.9713 Q49.2551,218.9713 48.5703,220.038 Q47.8855,221.1046 47.8855,223.2047 Q47.8855,225.2965 48.5703,226.3632 Q49.2551,227.4298 50.5999,227.4298 Q51.2307,227.4298 51.8242,227.1601 Q52.4177,226.8903 53.0486,226.3092 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.1172" x="106.9202" y="219.1798">&#171;Proxy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.1064" x="70.9255" y="235.2463">DocumentHandle</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="218.6074" y1="243.1994" y2="243.1994"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.1729" x="13" y="260.7345">-holders : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.2559" x="13" y="277.2228">-writeLockOwner : String</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="218.6074" y1="284.1759" y2="284.1759"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.6074" x="13" y="301.7111">+acquire() : DocumentHandle</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.125" x="13" y="318.1994">+lockForWriting(owner)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.2148" x="13" y="334.6877">+unlock(owner)</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="29" id="ent0008"><path d="M254.3,205.8683 L254.3,268.1083 L220.08,272.1083 L254.3,276.1083 L254.3,338.3527 A0,0 0 0 0 254.3,338.3527 L508.3034,338.3527 A0,0 0 0 0 508.3034,338.3527 L508.3034,215.8683 L498.3034,205.8683 L254.3,205.8683 A0,0 0 0 0 254.3,205.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M498.3034,205.8683 L498.3034,215.8683 L508.3034,215.8683 L498.3034,205.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.6436" x="260.3" y="223.4366">GoF's three smart-reference duties,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.4653" x="260.3" y="238.7472">all present:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="260.3" y="254.0577">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="58.9063" x="260.3" y="269.3683">counting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.0776" x="323.3195" y="269.3683">&#8212; closed only when the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.9023" x="260.3" y="284.6788">last holder lets go</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="151.7661" x="260.3" y="299.9894">loading on first access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.0786" x="416.1794" y="299.9894">&#8212; a virtual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.8901" x="260.3" y="315.2999">proxy hiding inside this one</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="49.0166" x="260.3" y="330.6105">locking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8735" x="313.4299" y="330.6105">&#8212; a second writer is refused</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="40" id="ent0011"><path d="M206.11,526.7483 L206.11,582.6799 A0,0 0 0 0 206.11,582.6799 L468.505,582.6799 A0,0 0 0 0 468.505,582.6799 L468.505,536.7483 L458.505,526.7483 L341.3,526.7483 L337.3,466.9583 L333.3,526.7483 L206.11,526.7483 A0,0 0 0 0 206.11,526.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M458.505,526.7483 L458.505,536.7483 L468.505,536.7483 L458.505,526.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.395" x="212.11" y="544.3166">Never opened until somebody actually</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.5103" x="212.11" y="559.6272">reads. Two holders, two closes,</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="24.4575" x="212.11" y="574.9377">one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.9971" x="240.6808" y="574.9377">real close.</text></g><g class="entity" data-qualified-name="N1" data-source-line="46" id="ent0013"><path d="M430.51,57.9083 L430.51,129.1505 L708.095,129.1505 L708.095,67.9083 L698.095,57.9083 L430.51,57.9083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M698.095,57.9083 L698.095,67.9083 L708.095,67.9083 L698.095,57.9083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5747" x="436.51" y="75.4766">close() here does not mean "close it".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.9741" x="436.51" y="90.7872">It means</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="146.688" x="494.5974" y="90.7872">"I am finished with it"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="641.2854" y="90.7872">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4771" x="436.51" y="106.0977">Get that wrong and you either leak the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.585" x="436.51" y="121.4083">handle or shut it under somebody's feet.</text></g><!--reverse link Document to StoredDocument--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="24" id="lnk4"><path codeLine="24" d="M410.9016,141.3502 C416.8616,144.9902 407.5,139.2083 413.3,142.5783 C462.48,171.1183 497,153.8383 526.3,202.5783 C558.15,255.5483 559.13,289.2683 526.3,341.6383 C503.84,377.4783 462.93,399.6283 424.9,413.1483" fill="none" id="Document-backto-StoredDocument" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="395.54,131.9683,407.7743,146.4708,414.0289,136.2297,395.54,131.9683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Document to DocumentHandle--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="25" id="lnk5"><path codeLine="25" d="M264.9015,151.6084 C241.0415,170.4084 227.07,181.4283 200.84,202.0983" fill="none" id="Document-backto-DocumentHandle" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="279.04,140.4683,261.1881,146.8956,268.6149,156.3213,279.04,140.4683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;s