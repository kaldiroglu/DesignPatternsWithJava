<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="472px" preserveAspectRatio="none" style="width:776px;height:472px;background:#FFFFFF;" version="1.1" viewBox="0 0 776 472" width="776px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="303.6865" x="232.9092" y="23.5352">Proxy &#8212; homework 3, the smart reference</text></g><!--class Document--><g class="entity" data-qualified-name="Document" data-source-line="7" id="ent0001"><rect fill="#F1F1F1" height="98.0859" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="115.5645" x="313.52" y="44.4883"/><ellipse cx="334.7409" cy="64.7988" fill="#B4A7E5" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M331.1686,61.064 L331.1686,58.9058 L338.548,58.9058 L338.548,61.064 L336.0827,61.064 L336.0827,69.1406 L338.548,69.1406 L338.548,71.2988 L331.1686,71.2988 L331.1686,69.1406 L333.634,69.1406 L333.634,61.064 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="55.0078" x="357.4895" y="61.0898">&#171;Subject&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="69.7402" x="350.1233" y="77.1563">Document</text><line style="stroke:#181818;stroke-width:0.5;" x1="314.52" x2="428.0845" y1="85.1094" y2="85.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5645" x="319.52" y="102.6445">+read() : String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.6914" x="319.52" y="119.1328">+write(text)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.9883" x="319.52" y="135.6211">+close()</text></g><!--class StoredDocument--><g class="entity" data-qualified-name="StoredDocument" data-source-line="13" id="ent0002"><rect fill="#F1F1F1" height="65.1094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="174.9551" x="542.83" y="239.5483"/><ellipse cx="571.1046" cy="259.8588" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M573.5777,266.0019 Q572.9967,266.3007 572.3575,266.4501 Q571.7183,266.5996 571.0128,266.5996 Q568.5059,266.5996 567.1861,264.9477 Q565.8663,263.2958 565.8663,260.1747 Q565.8663,257.0454 567.1861,255.3935 Q568.5059,253.7416 571.0128,253.7416 Q571.7183,253.7416 572.3658,253.8911 Q573.0133,254.0405 573.5777,254.3393 L573.5777,257.062 Q572.9468,256.4809 572.3533,256.2111 Q571.7598,255.9413 571.129,255.9413 Q569.7842,255.9413 569.0994,257.008 Q568.4146,258.0746 568.4146,260.1747 Q568.4146,262.2665 569.0994,263.3332 Q569.7842,264.3998 571.129,264.3998 Q571.7598,264.3998 572.3533,264.1301 Q572.9468,263.8603 573.5777,263.2792 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="79.377" x="605.094" y="256.1498">&#171;RealSubject&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.4561" x="588.0545" y="272.2162">StoredDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="543.83" x2="716.7851" y1="280.1694" y2="280.1694"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.9551" x="548.83" y="297.7045">+opensPerformed() : int</text></g><!--class DocumentHandle--><g class="entity" data-qualified-name="DocumentHandle" data-source-line="17" id="ent0003"><rect fill="#F1F1F1" height="139.0625" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="212.6074" x="7" y="202.5783"/><ellipse cx="50.5754" cy="222.8888" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M53.0486,229.0319 Q52.4675,229.3307 51.8284,229.4801 Q51.1892,229.6296 50.4836,229.6296 Q47.9768,229.6296 46.657,227.9777 Q45.3372,226.3258 45.3372,223.2047 Q45.3372,220.0754 46.657,218.4235 Q47.9768,216.7716 50.4836,216.7716 Q51.1892,216.7716 51.8367,216.9211 Q52.4841,217.0705 53.0486,217.3693 L53.0486,220.092 Q52.4177,219.5109 51.8242,219.2411 Q51.2307,218.9713 50.5999,218.9713 Q49.2551,218.9713 48.5703,220.038 Q47.8855,221.1046 47.8855,223.2047 Q47.8855,225.2965 48.5703,226.3632 Q49.2551,227.4298 50.5999,227.4298 Q51.2307,227.4298 51.8242,227.1601 Q52.4177,226.8903 53.0486,226.3092 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.1172" x="106.9202" y="219.1798">&#171;Proxy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.1064" x="70.9255" y="235.2462">DocumentHandle</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="218.6074" y1="243.1994" y2="243.1994"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.1729" x="13" y="260.7345">-holders : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.2559" x="13" y="277.2228">-writeLockOwner : String</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="218.6074" y1="284.1759" y2="284.1759"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.6074" x="13" y="301.7111">+acquire() : DocumentHandle</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.125" x="13" y="318.1994">+lockForWriting(owner)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.2148" x="13" y="334.6877">+unlock(owner)</text></g><g class="entity" data-qualified-name="GMN6" data-source-line="29" id="ent0007"><path d="M254.3,205.8583 L254.3,268.1083 L219.86,272.1083 L254.3,276.1083 L254.3,338.3427 A0,0 0 0 0 254.3,338.3427 L508.3034,338.3427 A0,0 0 0 0 508.3034,338.3427 L508.3034,215.8583 L498.3034,205.8583 L254.3,205.8583 A0,0 0 0 0 254.3,205.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M498.3034,205.8583 L498.3034,215.8583 L508.3034,215.8583 L498.3034,205.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.6436" x="260.3" y="223.4266">GoF's three smart-reference duties,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.4653" x="260.3" y="238.7372">all present:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="260.3" y="254.0477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="58.9063" x="260.3" y="269.3583">counting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.0776" x="323.3195" y="269.3583">&#8212; closed only when the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.9023" x="260.3" y="284.6688">last holder lets go</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="151.7661" x="260.3" y="299.9794">loading on first access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.0786" x="416.1794" y="299.9794">&#8212; a virtual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.8901" x="260.3" y="315.2899">proxy hiding inside this one</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="49.0166" x="260.3" y="330.6005">locking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.8735" x="313.4299" y="330.6005">&#8212; a second writer is refused</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="40" id="ent0010"><path d="M499.11,401.6383 L499.11,457.5699 A0,0 0 0 0 499.11,457.5699 L761.505,457.5699 A0,0 0 0 0 761.505,457.5699 L761.505,411.6383 L751.505,401.6383 L634.3,401.6383 L630.3,304.9483 L626.3,401.6383 L499.11,401.6383 A0,0 0 0 0 499.11,401.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M751.505,401.6383 L751.505,411.6383 L761.505,411.6383 L751.505,401.6383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.395" x="505.11" y="419.2066">Never opened until somebody actually</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.5103" x="505.11" y="434.5172">reads. Two holders, two closes,</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="24.4575" x="505.11" y="449.8277">one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.9971" x="533.6808" y="449.8277">real close.</text></g><g class="entity" data-qualified-name="N1" data-source-line="46" id="ent0012"><path d="M464.51,57.9083 L464.51,129.1505 L742.095,129.1505 L742.095,67.9083 L732.095,57.9083 L464.51,57.9083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M732.095,57.9083 L732.095,67.9083 L742.095,67.9083 L732.095,57.9083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5747" x="470.51" y="75.4766">close() here does not mean "close it".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.9741" x="470.51" y="90.7872">It means</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="146.688" x="528.5974" y="90.7872">"I am finished with it"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="675.2854" y="90.7872">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4771" x="470.51" y="106.0977">Get that wrong and you either leak the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.585" x="470.51" y="121.4083">handle or shut it under somebody's feet.</text></g><!--reverse link Document to StoredDocument--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="25" id="lnk4"><path codeLine="25" d="M444.3028,144.2973 C490.8328,176.0173 540.37,209.7983 583.6,239.2683" fill="none" id="Document-backto-StoredDocument" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="429.43,134.1583,440.9232,149.2549,447.6825,139.3396,429.43,134.1583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Document to DocumentHandle--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="26" id="lnk5"><path codeLine="26" d="M298.2271,144.5464 C269.0271,164.5364 247.66,179.1483 214.12,202.1083" fill="none" id="Document-backto-DocumentHandle" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="313.08,134.3783,294.8377,139.5955,301.6165,149.4974,313.08,134.3783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link DocumentHandle to StoredDocument--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-l