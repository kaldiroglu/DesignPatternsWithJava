0000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="135.9604" x="519.33" y="236.3166">Three kinds at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.3262" x="519.33" y="251.6272">Protection</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9482" x="591.7695" y="251.6272">&#8212; refuses when the seats are gone.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="44.897" x="519.33" y="266.9377">Virtual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.0449" x="568.3403" y="266.9377">&#8212; a refused student costs no object.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="106.2725" x="519.33" y="282.2483">Smart reference</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.457" x="629.7157" y="282.2483">&#8212; close() gives the seat back</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.8291" x="519.33" y="297.5588">and promotes whoever waited longest.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="52" id="ent0015"><path d="M1095.71,353.0583 L1095.71,408.9899 A0,0 0 0 0 1095.71,408.9899 L1351.7891,408.9899 A0,0 0 0 0 1351.7891,408.9899 L1351.7891,363.0583 L1341.7891,353.0583 L1227.75,353.0583 L1223.75,318.0483 L1219.75,353.0583 L1095.71,353.0583 A0,0 0 0 0 1095.71,353.0583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1341.7891,353.0583 L1341.7891,363.0583 L1351.7891,363.0583 L1341.7891,353.0583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" tex