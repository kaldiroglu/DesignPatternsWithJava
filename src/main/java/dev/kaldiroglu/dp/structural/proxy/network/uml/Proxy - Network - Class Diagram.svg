 reaches</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.7773" x="398.09" y="218.5177">the gateway.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="39" id="ent0017"><path d="M6,605.2883 L6,691.841 A0,0 0 0 0 6,691.841 L272.3623,691.841 A0,0 0 0 0 272.3623,691.841 L272.3623,615.2883 L262.3623,605.2883 L143.18,605.2883 L139.18,544.7183 L135.18,605.2883 L6,605.2883 A0,0 0 0 0 6,605.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M262.3623,605.2883 L262.3623,615.2883 L272.3623,615.2883 L262.3623,605.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.542" x="12" y="622.8566">Contains</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="95.5005" x="71.6553" y="622.8566">no access rule</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.3408" x="167.1558" y="622.8566">. Called</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.8633" x="12" y="638.1672">directly, it happily does the thing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.3623" x="12" y="653.4777">the proxy would have refused &#8212; which</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5493" x="12" y="668.7883">is how the tests prove where the rule</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.2271" x="12" y="684.0988">lives.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="47" id="ent0020"><path d="M328.57,475.5183 L328.57,531.4499 A0,0 0 0 0 328.57,531.4499 L607.7927,531.4499 A0,0 0 0 0 607.7927,531.4499 L607.7927,485.5183 L5