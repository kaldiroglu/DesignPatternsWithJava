:#181818;stroke-width:0.5;"/><path d="M854.7473,240.9583 L854.7473,250.9583 L864.7473,250.9583 L854.7473,240.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8091" x="630.55" y="258.5266">Five identical requests cost</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="24.4575" x="630.55" y="273.8372">one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.7168" x="659.1208" y="273.8372">supplier call.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="630.55" y="289.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2783" x="630.55" y="304.4583">A decorator forwards and adds.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.1948" x="630.55" y="319.7688">This forwards</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="72.9473" x="720.8581" y="319.7688">sometimes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.9419" x="793.8054" y="319.7688">, and the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.624" x="630.55" y="335.0794">benefit is in the times it does not.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="48" id="ent0013"><path d="M935.24,271.5783 L935.24,312.1994 A0,0 0 0 0 935.24,312.1994 L1130.0452,312.1994 A0,0 0 0 0 1130.0452,312.1994 L1130.0452,281.5783 L1120.0452,271.5783 L1047.94,271.5783 L1136.78,110.7583 L1039.94,271.5783 L935.24,271.5783 A0,0 0 0 0 935.24,271.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1120.0452,271.5783 L1120.0452,281.5783 L1130.0452,281.5783 L1120.0452,271.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8052" x="941.24" y="289.1466">Injected, so expiry is tested</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.6904" x="941.24" y="304.4572">without any test sleeping.</text></g><g class="entity" data-qualified-name="N1" data-source-line="53" id="ent0015"><path d="M1250.37,43.4883 L1250.37,145.3516 L1526.9266,145.3516 L1526.9266,53.4883 L1516.9266,43.4883 L1250.37,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1516.9266,43.4883 L1516.9266,53.4883 L1526.9266,53.4883 L1516.9266,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8599" x="1256.37" y="61.0566">The easy half is the saving.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.7886" x="1256.37" y="76.3672">The hard half is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="79.168" x="1359.2719" y="76.3672">invalidation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.6743" x="1438.4398" y="76.3672">: for up</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.9395" x="1256.37" y="91.6777">to one TTL this returns a price that is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.5566" x="1256.37" y="106.9883">wrong, and confidently. No pattern fixes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5894" x="1256.37" y="122.2988">that &#8212; somebody decides how stale the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.1694" x="1256.37" y="137.6094">business can afford to be.</text></g><!--class Spacer1--><g class="entity" data-qualified-name="Spacer1" data-source-line="61" id="ent0016"><rect fill="none" height="26.4883" rx="2.5" ry="2.5" style="stroke:none;stroke-width:0.5;" width="10.4297" x="268.43" y="278.6383"/></g><!--reverse link PriceService to SupplierPriceService--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="34" id="lnk6"><path codeLine="34" d="M245.1958,139.8482 C208.0058,176.1882 160.4,222.7183 123.21,259.0583" fill="none" id="PriceService-backto-SupplierPriceService" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="258.07,127.2683,241.0025,135.5568,249.3891,144.1396,258.07,127.2683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link PriceService to CachingPriceProxy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="35" id="lnk7"><path codeLine="35" d="M403.9500,222.0183 L334.8172,141.1595" fill="none" id="PriceService-backto-CachingPriceProxy" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="323.1200,127.4783,339.3776,137.2605,330.2568,145.0586,323.1200,127.4783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CachingPriceProxy to PriceService--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="aggregation" data-source-line="66" id="lnk21"><path codeLine="66" d="M338.2493,216.4015 C312.2693,199.3415 301.65,192.3583 301.65,192.3583 C301.65,192.3583 298.043,160.6365 294.843,132.3965" fill="none" id="CachingPriceProxy-PriceService" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="348.28,222.9