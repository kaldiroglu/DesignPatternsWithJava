73,63.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8091" x="323.55" y="80.6566">Five identical requests cost</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="24.4575" x="323.55" y="95.9672">one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.7168" x="352.1208" y="95.9672">supplier call.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="323.55" y="111.2777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2783" x="323.55" y="126.5883">A decorator forwards and adds.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.1948" x="323.55" y="141.8988">This forwards</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="72.9473" x="413.8581" y="141.8988">sometimes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.9419" x="486.8054" y="141.8988">, and the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.624" x="323.55" y="157.2094">benefit is in the times it does not.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="41" id="ent0015"><path d="M363.24,398.8983 L363.24,439.5194 A0,0 0 0 0 363.24,439.5194 L558.0452,439.5194 A0,0 0 0 0 558.0452,439.5194 L558.0452,408.8983 L548.0452,398.8983 L434.07,398.8983 L292.57,309.5683 L426.07,398.8983 L363.24,398.8983 A0,0 0 0 0 363.24,398.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M548.0452,398.8983 L548.0452,408.8983 L558.0452,408.8983 L548.0452,398.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8052" x="369.24" y="416.4666">Injected, so expiry is tested</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.6904" x="369.24" y="431.7772">without any test sleeping.</text></g><g class="entity" data-qualified-name="N1" data-source-line="46" id="ent0017"><path d="M592.37,63.0883 L592.37,164.9516 L868.9266,164.9516 L868.9266,73.0883 L858.9266,63.0883 L592.37,63.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M858.9266,63.0883 L858.9266,73.0883 L868.9266,73.0883 L858.9266,63.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8599" x="598.37" y="80.6566">The easy half is the saving.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.7886" x="598.37" y="95.9672">The hard half is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="79.168" x="701.2719" y="95.9672">invalidation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.6743" x="780.4398" y="95.9672">: for up</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.9395" x="598.37" y="111.2777">to one TTL this returns a price that is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.5566" x="598.37" y="126.5883">wrong, and confidently. No pattern fixes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5894" x="598.37" y="141.8988">that &#8212; somebody decides how stale the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.1694" x="598.37" y="157.2094">business can afford to be.</text></g><!--reverse link PriceService to SupplierPriceService--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="25" id="lnk6"><path codeLine="25" d="M98.4257,343.9704 C96.4857,362.5004 95.92,367.8483 93.98,386.3583" fill="none" id="PriceService-backto-SupplierPriceService" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="100.3,326.0683,92.4583,343.3457,104.3931,344.5952,100.3,326.0683" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link PriceService to CachingPriceProxy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="26" id="lnk7"><path codeLine="26" d="M149.0092,246.6949 C156.7692,237.7549 152.47,241.1483 157.65,230.5483 C164.68,216.1483 169.46,199.7083 172.72,183.8483" fill="none" id="PriceService-backto-CachingPriceProxy" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="137.21,260.2883,153.5403,250.628,144.478,242.7619,137.21,260.2883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CachingPriceProxy to PriceService--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="aggregation" data-source-line="27" id="lnk8"><path codeLine="27" d="M105.3482,193.9093 C99.1282,203.2893 100.4,203.2583 96.65,213.5483 C91.25,228.3383 91.2384,240.7748 93.8284,255.4048" fill="none" id="CachingPriceProxy-PriceService" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="111.98,183.9083,105.3305,186.6982,105.3482,193.9093,111.9978,191.1194,111.98,183.9083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#181818" points="94.7,260.3283,97.0698,250.7688,93.8284,255.4048,89.1923,252.1634,94.7,260.3283" style="stroke:#181818;stroke-width:1;st