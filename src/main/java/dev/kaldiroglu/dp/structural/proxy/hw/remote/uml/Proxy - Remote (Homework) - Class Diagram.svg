ont-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.8252" x="70.19" y="382.6934">-latencyMillis : long</text><line style="stroke:#181818;stroke-width:0.5;" x1="65.19" x2="226.2984" y1="389.6466" y2="389.6466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.5879" x="70.19" y="407.1817">+roundTrips() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.1084" x="70.19" y="423.67">+elapsedMillis() : long</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.5322" x="70.19" y="440.1583">+failNext(n) : Link</text></g><!--class RemoteCallFailedException--><g class="entity" data-qualified-name="RemoteCallFailedException" data-source-line="23" id="ent0005"><rect fill="#F1F1F1" height="32" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.3398" x="262.07" y="374.1283"/><ellipse cx="277.07" cy="390.1283" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M279.5431,396.2713 Q278.9621,396.5702 278.3229,396.7196 Q277.6838,396.869 276.9782,396.869 Q274.4714,396.869 273.1515,395.2171 Q271.8317,393.5653 271.8317,390.4442 Q271.8317,387.3148 273.1515,385.6629 Q274.4714,384.0111 276.9782,384.0111 Q277.6838,384.0111 278.3312,384.1605 Q278.9787,384.3099 279.5431,384.6088 L279.5431,387.3314 Q278.9123,386.7504 278.3188,386.4806 Q277.7253,386.2108 277.0944,386.2108 Q275.7497,386.2108 275.0649,387.2775 Q274.3801,388.3441 274.3801,390.4442 Q274.3801,392.536 275.0649,393.6026 Q275.7497,394.6693 277.0944,394.6693 Q277.7253,394.6693 278.3188,394.3995 Q278.9123,394.1297 279.5431,393.5487 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.3398" x="291.07" y="395.4193">RemoteCallFailedException</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="32" id="ent0012"><path d="M352.23,58.7983 L352.23,82.7683 L317.25,86.7683 L352.23,90.7683 L352.23,114.7299 A0,0 0 0 0 352.23,114.7299 L591.2529,114.7299 A0,0 0 0 0 591.2529,114.7299 L591.2529,68.7983 L581.2529,58.7983 L352.23,58.7983 A0,0 0 0 0 352.23,58.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M581.2529,58.7983 L581.2529,68.7983 L591.2529,68.7983 L581.2529,58.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.0229" x="358.23" y="76.3666">Says nothing about latency, failure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.0732" x="358.23" y="91.6772">or timeouts.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="122.77" x="439.4165" y="91.6772">That silence is the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.8442" x="358.23" y="106.9877">exercise.&lt;/b&gt;</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="38" id="ent0015"><path d="M18.48,508.1083 L18.48,564.0399 A0,0 0 0 0 18.48,564.0399 L273.0039,564.0399 A0,0 0 0 0 273.0039,564.0399 L273.0039,518.1083 L263.0039,508.1083 L149.74,508.1083 L145.74,447.1983 L141.74,508.1083 L18.48,508.1083 A0,0 0 0 0 18.48,508.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M263.0039,508.1083 L263.0039,518.1083 L273.0039,518.1083 L263.0039,508.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.7759" x="24.48" y="525.6766">Failures are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.52" x="101.3692" y="525.6766">scripted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.2852" x="155.8892" y="525.6766">, latency is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5239" x="24.48" y="540.9872">counted rather than slept &#8212; so every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0869" x="24.48" y="556.2977">run and every test agrees.</text></g><g class="entity" data-qualified-name="N1" data-source-line="44" id="ent0017"><path d="M626.09,43.4883 L626.09,130.041 L907.401,130.041 L907.401,53.4883 L897.401,43.4883 L626.09,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M897.401,43.4883 L897.401,53.4883 L907.401,53.4883 L897.401,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7813" x="632.09" y="61.0566">A six-line basket becomes</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="88.4165" x="803.9845" y="61.0566">6 round trips</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7007" x="632.09" y="76.3672">and 720 ms&lt;/b&gt;. The proxy did its job</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.1719" x="632.09" y="91.6777">perfectly &#8212; it made a remote object look</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.6255" x="632.09" y="106.9883">local &#8212; and that is exactly how the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3223" x="632.09" y="122.2988">mistake gets made.</text></g><!--reverse link InventoryService to WarehouseInventory--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="25" id="lnk6"><path 