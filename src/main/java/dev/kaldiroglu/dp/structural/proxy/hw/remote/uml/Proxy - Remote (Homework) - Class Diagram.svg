0" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.8252" x="116.19" y="382.6934">-latencyMillis : long</text><line style="stroke:#181818;stroke-width:0.5;" x1="111.19" x2="272.2984" y1="389.6466" y2="389.6466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.5879" x="116.19" y="407.1817">+roundTrips() : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.1084" x="116.19" y="423.67">+elapsedMillis() : long</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.5322" x="116.19" y="440.1583">+failNext(n) : Link</text></g><!--class RemoteCallFailedException--><g class="entity" data-qualified-name="RemoteCallFailedException" data-source-line="31" id="ent0005"><rect fill="#F1F1F1" height="32" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.3398" x="308.07" y="374.1283"/><ellipse cx="323.07" cy="390.1283" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M325.5431,396.2713 Q324.9621,396.5702 324.3229,396.7196 Q323.6838,396.869 322.9782,396.869 Q320.4714,396.869 319.1515,395.2171 Q317.8317,393.5653 317.8317,390.4442 Q317.8317,387.3148 319.1515,385.6629 Q320.4714,384.0111 322.9782,384.0111 Q323.6838,384.0111 324.3312,384.1605 Q324.9787,384.3099 325.5431,384.6088 L325.5431,387.3314 Q324.9123,386.7504 324.3188,386.4806 Q323.7253,386.2108 323.0944,386.2108 Q321.7497,386.2108 321.0649,387.2775 Q320.3801,388.3441 320.3801,390.4442 Q320.3801,392.536 321.0649,393.6026 Q321.7497,394.6693 323.0944,394.6693 Q323.7253,394.6693 324.3188,394.3995 Q324.9123,394.1297 325.5431,393.5487 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.3398" x="337.07" y="395.4193">RemoteCallFailedException</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="37" id="ent0009"><path d="M323.23,58.7983 L323.23,114.7299 L562.2529,114.7299 L562.2529,68.7983 L552.2529,58.7983 L323.23,58.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M552.2529,58.7983 L552.2529,68.7983 L562.2529,68.7983 L552.2529,58.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.0229" x="329.23" y="76.3666">Says nothing about latency, failure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.0732" x="329.23" y="91.6772">or timeouts.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="122.77" x="410.4165" y="91.6772">That silence is the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.8442" x="329.23" y="106.9877">exercise.&lt;/b&gt;</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="43" id="ent0012"><path d="M64.48,508.1083 L64.48,564.0399 A0,0 0 0 0 64.48,564.0399 L319.0039,564.0399 A0,0 0 0 0 319.0039,564.0399 L319.0039,518.1083 L309.0039,508.1083 L195.74,508.1083 L191.74,447.1983 L187.74,508.1083 L64.48,508.1083 A0,0 0 0 0 64.48,508.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M309.0039,508.1083 L309.0039,518.1083 L319.0039,518.1083 L309.0039,508.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.7759" x="70.48" y="525.6766">Failures are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.52" x="147.3692" y="525.6766">scripted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.2852" x="201.8892" y="525.6766">, latency is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5239" x="70.48" y="540.9872">counted rather than slept &#8212; so every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0869" x="70.48" y="556.2977">run and every test agrees.</text></g><g class="entity" data-qualified-name="N1" data-source-line="49" id="ent0014"><path d="M597.09,43.4883 L597.09,130.041 L878.401,130.041 L878.401,53.4883 L868.401,43.4883 L597.09,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M868.401,43.4883 L868.401,53.4883 L878.401,53.4883 L868.401,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7813" x="603.09" y="61.0566">A six-line basket becomes</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="88.4165" x="774.9845" y="61.0566">6 round trips</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7007" x="603.09" y="76.3672">and 720 ms&lt;/b&gt;. The proxy did its job</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.1719" x="603.09" y="91.6777">perfectly &#8212; it made a remote object look</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.6255" x="603.09" y="106.9883">local &#8212; and that is exactly how the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3223" x="603.09" y="122.2988">mistake gets made.</text></g><!--class Spacer1--><g class="entity" data-qualified-name="Spacer1" data-source-line="56" id="ent0015"><rect fill="none" height="26.4883" rx="2.5" ry="2.5" style="stroke:none;stroke-width:0.5;" width="10.4297" x="211.53" y="226.3583"/></g><!--reverse link InventoryService to WarehouseInventory--><g class="link