 fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.8691" x="12" y="563.4583">changed the object's type &#8212; which is why</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.1406" x="12" y="578.7688">nothing here can switch once it exists.</text></g><g class="entity" data-qualified-name="N1" data-source-line="38" id="ent0019"><path d="M685.58,43.4883 L685.58,139.4629 L950.5473,139.4629 L950.5473,53.4883 L940.5473,43.4883 L685.58,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M940.5473,43.4883 L940.5473,53.4883 L950.5473,53.4883 L940.5473,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.0791" x="691.58" y="61.0566">2 refinements x 2 implementations</text><text fill="#000000" font-family="sans-serif" font-size="21" font-weight="700" lengthAdjust="spacing" textLength="146.1592" x="691.58" y="84.1016">4 leaf classes</text><text fill="#000000" font-family="sans-serif" font-size="17" font-weight="700" lengthAdjust="spacing" textLength="97.8081" x="837.7392" y="84.9453">, plus the 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.4424" x="691.58" y="101.0996">refinements themselves =</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="8.5757" x="860.1357" y="101.0996">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="868.7113" y="101.0996">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="691.58" y="116.4102">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.498" x="691.58" y="131.7207">A third implementation costs</text>