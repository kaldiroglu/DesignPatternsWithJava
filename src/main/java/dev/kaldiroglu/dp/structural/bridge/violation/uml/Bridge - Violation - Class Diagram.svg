<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="602px" preserveAspectRatio="none" style="width:876px;height:602px;background:#FFFFFF;" version="1.1" viewBox="0 0 876 602" width="876px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="395.377" x="237.175" y="23.5352">Why the implementation does not belong in a subclass</text></g><!--class AType--><g class="entity" data-qualified-name="AType" data-source-line="6" id="ent0001"><rect fill="#F1F1F1" height="97.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.499" x="63.39" y="99.2783"/><ellipse cx="128.1708" cy="115.2783" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M130.6439,121.4213 Q130.0629,121.7202 129.4237,121.8696 Q128.7845,122.019 128.079,122.019 Q125.5721,122.019 124.2523,120.3671 Q122.9325,118.7153 122.9325,115.5942 Q122.9325,112.4648 124.2523,110.8129 Q125.5721,109.1611 128.079,109.1611 Q128.7845,109.1611 129.432,109.3105 Q130.0795,109.4599 130.6439,109.7587 L130.6439,112.4814 Q130.013,111.9004 129.4195,111.6306 Q128.826,111.3608 128.1952,111.3608 Q126.8504,111.3608 126.1656,112.4275 Q125.4808,113.4941 125.4808,115.5942 Q125.4808,117.686 126.1656,118.7526 Q126.8504,119.8193 128.1952,119.8193 Q128.826,119.8193 129.4195,119.5495 Q130.013,119.2797 130.6439,118.6987 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.4375" x="148.6708" y="120.5693">AType</text><line style="stroke:#181818;stroke-width:0.5;" x1="64.39" x2="242.889" y1="131.2783" y2="131.2783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.541" x="69.39" y="148.8134">#anIntVariable : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.499" x="69.39" y="165.3017">#aBoolVariable : boolean</text><line style="stroke:#181818;stroke-width:0.5;" x1="64.39" x2="242.889" y1="172.2548" y2="172.2548"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.9082" x="69.39" y="189.79">+doIt() : void</text></g><!--class ASubType--><g class="entity" data-qualified-name="ASubType" data-source-line="12" id="ent0002"><rect fill="#F1F1F1" height="97.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="176.1104" x="65.59" y="312.5283"/><ellipse cx="115.6564" cy="328.5283" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M118.1296,334.6713 Q117.5485,334.9702 116.9093,335.1196 Q116.2702,335.269 115.5646,335.269 Q113.0578,335.269 111.7379,333.6171 Q110.4181,331.9653 110.4181,328.8442 Q110.4181,325.7148 111.7379,324.0629 Q113.0578,322.4111 115.5646,322.4111 Q116.2702,322.4111 116.9176,322.5605 Q117.5651,322.7099 118.1296,323.0087 L118.1296,325.7314 Q117.4987,325.1504 116.9052,324.8806 Q116.3117,324.6108 115.6808,324.6108 Q114.3361,324.6108 113.6513,325.6775 Q112.9665,326.7441 112.9665,328.8442 Q112.9665,330.936 113.6513,332.0026 Q114.3361,333.0693 115.6808,333.0693 Q116.3117,333.0693 116.9052,332.7995 Q117.4987,332.5297 118.1296,331.9487 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.4775" x="136.1564" y="333.8193">ASubType</text><line style="stroke:#181818;stroke-width:0.5;" x1="66.59" x2="240.7004" y1="344.5283" y2="344.5283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.1104" x="71.59" y="362.0634">-aStringVariable : String</text><line style="stroke:#181818;stroke-width:0.5;" x1="66.59" x2="240.7004" y1="369.0166" y2="369.0166"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.9082" x="71.59" y="386.5517">+doIt() : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0957" x="71.59" y="403.04">+writeIt() : void</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="21" id="ent0005"><path d="M278.55,120.0483 L278.55,144.0083 L244.29,148.0083 L278.55,152.0083 L278.55,175.9799 A0,0 0 0 0 278.55,175.9799 L514.7229,175.9799 A0,0 0 0 0 514.7229,175.9799 L514.7229,130.0483 L504.7229,120.0483 L278.55,120.0483 A0,0 0 0 0 278.55,120.0483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M504.7229,120.0483 L504.7229,130.0483 L514.7229,130.0483 L504.7229,120.0483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.3882" x="284.55" y="137.6166">The contract:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.6714" x="376.0515" y="137.6166">calling doIt() prints.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5732" x="284.55" y="152.9272">Every caller holding an AType is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.5264" x="284.55" y="168.2377">entitled to rely on that.</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="27" id="ent0008"><path d="M6,469.9983 L6,587.1721 A0,0 0 0 0 6,587.1721 L301.2822,587.1721 A0,0 0 0 0 301.2822,587.1721 L301.2822,479.9983 L291.2822,469.9983 L157.64,469.9983 L153.64,410.0783 L149.64,469.9983 L6,469.9983 A0,0 0 0 0 6,469.9983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M291.2822,469.9983 L291.2822,479.9983 L301.2822,479.9983 L291.2822,469.9983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="91.0698" x="12" y="487.5666">The violation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.9175" x="107.1831" y="487.5666">doIt() stores instead of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.1504" x="12" y="502.8772">printing, so a caller holding an AType gets</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.2822" x="12" y="518.1877">silence &#8212; no exception, no log line, no way</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1743" x="12" y="533.4983">to tell except by testing the type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="12" y="548.8088">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.897" x="12" y="564.1194">A breach of the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="129.2319" x="113.0103" y="564.1194">Liskov Substitution</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5117" x="12" y="579.4299">Principle&lt;/b&gt;, and it compiles perfectly.</text></g><g class="entity" data-qualified-name="N1" data-source-line="37" id="ent0010"><path d="M549.56,43.4883 L549.56,252.5254 L861.727,252.5254 L861.727,53.4883 L851.727,43.4883 L549.56,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M851.727,43.4883 L851.727,53.4883 L861.727,53.4883 L851.727,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="133.8975" x="555.56" y="61.0566">This is not a Bridge.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.4868" x="693.5707" y="61.0566">It is the argument</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.6069" x="555.56" y="76.3672">for one.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="555.56" y="91.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.5981" x="555.56" y="106.9883">Subclassing was used to change</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="28.0566" x="762.2714" y="106.9883">how</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8359" x="555.56" y="122.2988">something is done, which is what an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4126" x="555.56" y="137.6094">implementation is for &#8212; and overriding to do</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.167" x="555.56" y="152.9199">that can break a promise the supertype made.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="555.56" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.0513" x="555.56" y="183.541">Delegation cannot: a refinement in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6733" x="555.56" y="198.8516">bridge.basic.pattern runs its own body and</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.9609" x="555.56" y="214.1621">then</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8071" x="589.6342" y="214.1621">calls implementation.doingIt(), so its</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.2041" x="555.56" y="229.4727">own contract survives whichever</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.8193" x="555.56" y="244.7832">implementation it holds.</text></g><!--reverse link AType to ASubType--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="18" id="lnk3"><path codeLine="18" d="M153.64,215.2083 C153.64,249.6783 153.64,277.8583 153.64,312.2683" fill="none" id="AType-backto-ASubType" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="153.64,197.2083,147.64,215.2083,159.64,215.2083,153.64,197.2083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src TLFBRjH04BpxArhY0Y9Pu1f5aJQ2mqe88Mq4vx7TQuyodhPcshkOXyH7y8Ly2TNZtLK8uMJDJ7TrLNKvt_iukkG6QeBBUQsQV3qfRng9M_-LwNNL-vQ9Xr5d6dYeEULAlGQcp_rCsZFvOGmyS5IdNYArmfcYADKS97Ra8pdAKrq6L5LLlhI-cqUcRnNHCt9n4_MJIzxLWBr2XoxtjoBXmNsD8xk8jvUOij7dBt2v5zzMFywmswa-8r-Isq9Fx1vWB1TFGDZD8Nb8_njt8Nhz_VBo35vLaCUKVDShoMxH0e3h-kOEVi0wJQxHg-jNzGqrBWHCF4qRCLxp2jNlzfpcyio9UWcjLRbuTCPdbC1JSxeb5KeSPeAzsZjTLHnRy_X4fHPL6GgN4ySpdRsNK3QpAdoEFB9AmfvypCgkHISQ2ZUmkA0isDd_g7MiHYxxmB5X-ltp5wWGVsbuj34NTWhI4MHpEHpSZ7feK0xXM4WrmiFPnfKGAP1N5ShML2TsJMzYx04gtljyBtk2CjJhP4DG-15i6u_ecQmBq6l9AymVHX3BD7BQSQDX_iSib-d3cvC_7XuiSNLqctpRyMBJHktU2BZKJPPkTEmaOGKBp-qnqIRW0CWfBtjgUXUxGhkNWq6PLJAmzbO9p5RCbaFleH770_P99TIF_YEysJoprxG9uW9-nIy1Y3bghGtsOexTGy2OPF2P2-qymG5pbGRNBfJVSk1k0KSND5-X9_4EUxAn20EAwiM4scNVh4QdoYbIcY9yqanom3HfPwEqM8XPyHpq_4Z4gXKGji2LJFaI7CCu_IEWcVP-ptanX27o2IUqX30_sEGV?></g></svg>