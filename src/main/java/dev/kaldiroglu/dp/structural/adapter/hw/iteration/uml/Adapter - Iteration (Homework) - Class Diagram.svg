512,534.1505 Q76.4987,534.2999 77.0631,534.5988 L77.0631,537.3214 Q76.4323,536.7404 75.8388,536.4706 Q75.2453,536.2008 74.6144,536.2008 Q73.2697,536.2008 72.5849,537.2675 Q71.9001,538.3341 71.9001,540.4342 Q71.9001,542.526 72.5849,543.5926 Q73.2697,544.6593 74.6144,544.6593 Q75.2453,544.6593 75.8388,544.3895 Q76.4323,544.1197 77.0631,543.5387 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.7305" x="88.59" y="545.4093">ArrayCursor</text></g><!--class CursorIteratorAdapter--><g class="entity" data-qualified-name="CursorIteratorAdapter" data-source-line="18" id="ent0004"><rect fill="#F1F1F1" height="40.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="181.4404" x="25.73" y="258.9383"/><ellipse cx="40.73" cy="279.2488" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M43.2031,285.3919 Q42.6221,285.6907 41.9829,285.8401 Q41.3438,285.9896 40.6382,285.9896 Q38.1314,285.9896 36.8115,284.3377 Q35.4917,282.6858 35.4917,279.5647 Q35.4917,276.4354 36.8115,274.7835 Q38.1314,273.1316 40.6382,273.1316 Q41.3438,273.1316 41.9912,273.2811 Q42.6387,273.4305 43.2031,273.7293 L43.2031,276.452 Q42.5723,275.8709 41.9788,275.6011 Q41.3853,275.3313 40.7544,275.3313 Q39.4097,275.3313 38.7249,276.398 Q38.0401,277.4646 38.0401,279.5647 Q38.0401,281.6565 38.7249,282.7232 Q39.4097,283.7898 40.7544,283.7898 Q41.3853,283.7898 41.9788,283.5201 Q42.5723,283.2503 43.2031,282.6692 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="58.6699" x="100.1153" y="275.5398">&#171;Adapter&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.4404" x="54.73" y="291.6063">CursorIteratorAdapter</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="25" id="ent0009"><path d="M241.98,235.9683 L241.98,275.2483 L207.66,279.2483 L241.98,283.2483 L241.98,322.521 A0,0 0 0 0 241.98,322.521 L506.9331,322.521 A0,0 0 0 0 506.9331,322.521 L506.9331,245.9683 L496.9331,235.9683 L241.98,235.9683 A0,0 0 0 0 241.98,235.9683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M496.9331,235.9683 L496.9331,245.9683 L506.9331,245.9683 L496.9331,235.9683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.6509" x="247.98" y="253.5366">hasNext and next map cleanly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="247.98" y="268.8472">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="184.4438" x="247.98" y="284.1577">remove maps onto nothing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.396" x="436.5371" y="284.1577">A Cursor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.0439" x="247.98" y="299.4683">has no notion of removal, and no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.6558" x="247.98" y="314.7788">translation invents one.</text></g><g class="entity" data-qualified-name="N1" data-source-line="33" id="ent0011"><path d="M229.15,43.4883 L229.15,175.9727 L503.7643,175.9727 L503.7643,53.4883 L493.7643,43.4883 L229.15,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M493.7643,43.4883 L493.7643,53.4883 L503.7643,53.4883 L493.7643,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.7168" x="235.15" y="61.0566">GoF, p. 141: how useful an adapter is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.6143" x="235.15" y="76.3672">depends on how much of the Target the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.542" x="235.15" y="91.6777">adaptee can support.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="235.15" y="106.9883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.522" x="235.15" y="122.2988">The honest answer is to</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="39.2349" x="389.7853" y="122.2988">throw</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.7573" x="429.0201" y="122.2988">. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.2842" x="235.15" y="137.6094">tempting one is to do nothing quietly,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2261" x="235.15" y="152.9199">and hand back a collection the caller</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.7529" x="235.15" y="168.2305">believes it has modified.</text></g><!--reverse link Iterator to CursorIteratorAdapter--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="extension" data-source-line="20" id="lnk5"><path codeLine="20" d="M116.46,177.1783 C116.46,210.2283 116.46,234.2483 116.46,258.5083" fill="none" id="Iterator-backto-CursorIteratorAdapter" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="116.46,159.1783,110.46,177.1783,122.46,177.1783,116.46,159.1783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link Cursor to ArrayCursor--><g class="link" data-entity-1="ent0002" data-e