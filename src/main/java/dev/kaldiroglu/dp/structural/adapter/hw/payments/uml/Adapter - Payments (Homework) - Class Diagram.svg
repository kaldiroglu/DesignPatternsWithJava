ly="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.8911" x="55.68" y="576.0083">adapter is where it stops.</text></g><g class="entity" data-qualified-name="N1" data-source-line="44" id="ent0014"><path d="M538.61,43.4883 L538.61,130.041 L801.8048,130.041 L801.8048,53.4883 L791.8048,43.4883 L538.61,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M791.8048,43.4883 L791.8048,53.4883 L801.8048,53.4883 L791.8048,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.1597" x="544.61" y="61.0566">The riskiest line is the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="47.2964" x="687.8829" y="61.0566">default</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.8208" x="739.2926" y="61.0566">case:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.1948" x="544.61" y="76.3672">a code you have not seen must still be</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.5796" x="544.61" y="91.6777">a failure. Translating only the codes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.104" x="544.61" y="106.9883">you know is how a decline becomes a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.9312" x="544.61" y="122.2988">delivered order.</text></g><!--reverse link PaymentProcessor to LegacyGatewayAdapter--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="extension" data-source-line="23" id="lnk5"><path codeLine="23" d="M325.21,146.0183 C325.21,168.4483 325.21,178.2983 325.21,200.7283" fill="none" id="PaymentProcessor-backto-LegacyGatewayAdapter" style="