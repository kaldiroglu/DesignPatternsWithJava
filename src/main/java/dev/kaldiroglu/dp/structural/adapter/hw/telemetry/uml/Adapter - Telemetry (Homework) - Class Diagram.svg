 Q88.7927,201.2816 91.2996,201.2816 Q92.0051,201.2816 92.6526,201.4311 Q93.3001,201.5805 93.8645,201.8793 L93.8645,204.602 Q93.2337,204.0209 92.6402,203.7511 Q92.0467,203.4813 91.4158,203.4813 Q90.0711,203.4813 89.3863,204.548 Q88.7014,205.6146 88.7014,207.7147 Q88.7014,209.8065 89.3863,210.8732 Q90.0711,211.9398 91.4158,211.9398 Q92.0467,211.9398 92.6402,211.6701 Q93.2337,211.4003 93.8645,210.8192 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="58.6699" x="163.3003" y="203.6898">&#171;Adapter&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.5938" x="109.8383" y="219.7562">PluggableSensorAdapter</text><line style="stroke:#181818;stroke-width:0.5;" x1="57.38" x2="297.4435" y1="227.7094" y2="227.7094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.5752" x="62.38" y="245.2445">-nameFn : Supplier&lt;String&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5166" x="62.38" y="261.7328">-celsiusFn : DoubleSupplier</text><line style="stroke:#181818;stroke-width:0.5;" x1="57.38" x2="297.4435" y1="268.6859" y2="268.6859"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="181.0566" x="62.38" y="286.2211">+of(probe) : CelsiusSensor</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="230.0635" x="62.38" y="302.7094">+of(thermometer) : CelsiusSensor</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="33" id="ent0009"><path d="M333.06,189.7883 L333.06,244.3783 L298.7,248.3783 L333.06,252.3783 L333.06,306.9621 A0,0 0 0 0 333.06,306.9621 L573.7778,306.9621 A0,0 0 0 0 573.7778,306.9621 L573.7778,199.7883 L563.7778,189.7883 L333.06,189.7883 A0,0 0 0 0 333.06,189.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M563.7778,189.7883 L563.7778,199.7883 L573.7778,199.7883 L563.7778,189.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="26.8569" x="339.06" y="207.3566">One</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.3838" x="370.0302" y="207.3566">adapter class, any number of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8184" x="339.06" y="222.6672">instruments &#8212; GoF technique (c),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.1826" x="339.06" y="237.9777">p. 143.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="339.06" y="253.2883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.2422" x="339.06" y="268.5988">The obvious design is one adapter</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7178" x="339.06" y="283.9094">per adaptee, and a new class every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.2861" x="339.06" y="299.2199">quarter.</text></g><g class="entity" data-qualified-name="N1" data-source-line="43" id="ent0011"><path d="M297.72,49.6683 L297.72,120.9105 L571.1092,120.9105 L571.1092,59.6683 L561.1092,49.6683 L297.72,49.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M561.1092,49.6683 L561.1092,59.6683 L571.1092,59.6683 L561.1092,49.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4077" x="303.72" y="67.2366">The trade: nothing names the adaptee</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.3892" x="303.72" y="82.5472">any more, so the compiler cannot check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.9507" x="303.72" y="97.8577">that the right conversion was paired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4556" x="303.72" y="113.1683">with the right instrument.</text></g><!--reverse link CelsiusSensor to PluggableSensorAdapter--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="extension" data-source-line="28" id="lnk5"><path codeLine="28" d="M177.41,144.5183 C177.41,162.6883 177.41,166.5483 177.41,186.6583" fill="none" id="CelsiusSensor-backto-PluggableSensorAdapter" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="177.41,126.5183,171.41,144.5183,183.41,144.5183,177.41,126.5183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PluggableSensorAdapter to FahrenheitProbe--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="29" id="lnk6"><path codeLine="29" d="M144.64,309.8183 C130.96,335.0683 117.8135,359.3229 105.5635,381.9129" fill="none" id="PluggableSensorAdapter-to-FahrenheitProbe" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="103.18,386.3083,110.9865,380.3035,105.5635,381.9129,103.954,376.4899,103.18,386.3083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.6885" x="127.54" y="353.2266">via a lambda</text></g><!--link PluggableSensorAdapter to KelvinThermometer--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-