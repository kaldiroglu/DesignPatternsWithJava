(),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6489" x="1070.44" y="414.8783">records two entries, and one undo takes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.6865" x="1070.44" y="430.1888">back only the deposit.</text></g><!--link Teller to Account--><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" data-source-line="57" id="lnk15"><path codeLine="57" d="M904.48,258.8783 C887.68,292.4283 870.748,326.2371 857.148,353.4071" fill="none" id="Teller-to-Account" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="854.91,357.8783,862.5154,351.6206,857.148,353.4071,855.3616,348.0398,854.91,357.8783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Teller to Kind--><g class="link" data-entity-1="ent0012" data-entity-2="ent0014" data-link-type="dependency" data-source-line="58" id="lnk16"><path codeLine="58" d="M956.45,258.8783 C963.56,292.4283 970.6348,325.8166 976.3848,352.9866" fill="none" id="Teller-to-Kind" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="977.42,357.8783,979.4699,348.2451,976.3848,352.9866,971.6433,349.9015,977.42,357.8783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link OneStepAccount to HistoryAccount--><!--link HistoryAccount to Teller--><?plantuml-src dLHDZzf03BtpAwozT561zbmX92IG5hNLLWkhFLGzE8aXqqncqXcdY5Ryztec0SA7jAiU41dRp-DvpxOlbAdGOGcfHk-dp4ubDTCYjMQf_X1yxEKg8w2ouXsKL2RaV8yLQu9LJi2aDRbt7cgJsG5mxeWWjuOy0p87cE_rAamBt13SUGv_uhw3lprexeH7GqkcQfgcjZOS7G13I52ZIGa-mLS1x5gh8FYpCfcObrAhsNJiqp8cw0BUGqQLzOhlewtV6hUAyypXzjmQtd0V3dlv6Si4YMMs9TZrHP4HC4ucOWKlPdcItet67v89JC6Ja9V5RB2MKdt8bKkfemXRRMr8gDYBbxIuqOMRR54GLH86Q-i0mQV2fGaOacoXdDx-YahUsYwL3ygpTRktKPd9jvXczAkcyTomsqrQJoZzjk__-0m7Hvt3JrixW_g-BtTyaPh7ZPQ7Er8qpn4hRY5